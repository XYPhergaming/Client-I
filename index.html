<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Browser Terminal</title>
<style>
*,*::before,*::after{box-sizing:border-box;border-width:0;border-style:solid;border-color:#e5e7eb}
::selection{background:#2563eb;color:#fff}
html{line-height:1.5;-webkit-text-size-adjust:100%;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif}
body{margin:0;overflow:hidden;height:100vh;display:flex;flex-direction:column}
.flex{display:flex}.flex-col{flex-direction:column}.items-center{align-items:center}
.justify-between{justify-content:space-between}.justify-end{justify-content:flex-end}
.justify-center{justify-content:center}

.whitespace-pre{white-space:pre}.whitespace-pre-wrap{white-space:pre-wrap}.break-all{word-break:break-all}
.text-black{color:#000}.text-white{color:#fff}
.text-red-500{color:#ef4444}.text-red-600{color:#dc2626}
.text-blue-600{color:#2563eb}.text-green-500{color:#22c55e}.text-green-600{color:#16a34a}
.text-yellow-600{color:#ca8a04}.text-gray-400{color:#9ca3af}.text-gray-700{color:#374151}

.shadow-2xl{box-shadow:0 25px 50px -12px rgba(0,0,0,.25)}
.hidden{display:none!important}.overflow-hidden{overflow:hidden}
.overflow-y-auto{overflow-y:auto}.absolute{position:absolute}
.inset-0{top:0;right:0;bottom:0;left:0}.z-50{z-index:50}

.term{
    scrollbar-width:thin;
    touch-action:manipulation;
    user-select:text;
    -webkit-user-select:text;
    padding-bottom: 45vh !important;
}
.term::-webkit-scrollbar{width:8px}
.term::-webkit-scrollbar-thumb{background:rgba(128,128,128,.5);border-radius:4px}

.cursor-block{display:inline-block;width:.6em;height:1.2em;background:currentColor;
vertical-align:middle;animation:blink 1.2s step-end infinite;pointer-events:none;user-select:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
#capture{position:absolute;opacity:0;width:1px;height:1px;z-index:-1;pointer-events:none}
#workspace{position:relative;flex:1;overflow:hidden}
#editor-text{flex:1;width:100%;padding:1rem;background:#fff;color:#1f2937;
border:0;outline:0;font-family:ui-monospace,monospace;font-size:.875rem;resize:none}

align-items:center;justify-content:center;padding:1rem}

width:100%;max-width:28rem;overflow:hidden;display:flex;flex-direction:column;max-height:90vh}

border-radius:.5rem;outline:0;color:#1f2937;background:#fff}
.settings-card input:focus,.settings-card select:focus{box-shadow:0 0 0 2px #2563eb;border-color:transparent}

#boot-error{background:#000}
</style>
</head>
<body class="font-mono text-sm">

<main id="workspace">
  <textarea id="capture" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
</main>

<div id="boot-error" class="hidden fixed inset-0 flex flex-col items-center justify-center p-6" style="z-index:999">
  <h1 class="text-3xl font-bold text-red-500 tracking-widest mb-6">CONNECTION FAIL</h1>
  <button onclick="location.reload()" class="px-6 py-2 border border-red-500 text-red-500 rounded hover:bg-red-500 hover:text-black transition cursor-pointer">RETRY</button>
</div>

<div id="editor" class="hidden absolute inset-0 bg-white z-50 flex flex-col font-sans">
  <div class="bg-gray-50 px-4 py-2 border-b flex justify-between items-center">
    <input type="text" id="editor-name" class="text-blue-600 font-bold bg-transparent outline-none border-b border-blue-600 w-1/2" value="file">
    <div class="flex gap-2">
      <button id="editor-close" class="px-3 py-1 bg-white border rounded cursor-pointer">Close</button>
      <button id="editor-save" class="px-3 py-1 bg-blue-600 text-white rounded cursor-pointer">Save</button>
    </div>
  </div>
  <textarea id="editor-text" spellcheck="false"></textarea>
</div>

<div id="settings" class="hidden absolute inset-0 z-50 font-sans">
  <div class="settings-card">
    <div class="px-4 py-2 border-b flex justify-between items-center bg-gray-50">
      <h2 class="text-lg font-bold text-black">Terminal Settings</h2>
      <button id="settings-x" class="text-2xl font-bold text-black cursor-pointer">&times;</button>
    </div>
    <div class="p-4 flex-1 overflow-y-auto">
      <div class="mb-4">
        <label>User Name</label>
        <input type="text" id="s-user" value="user">
      </div>
      <div class="mb-4">
        <label>Font Colour</label>
        <select id="s-font">
          <option value="text-black">Black</option>
          <option value="text-white">White</option>
          <option value="text-green-600">Green</option>
        </select>
      </div>
      <div class="mb-4">
        <label>Background</label>
        <select id="s-bg">
          <option value="bg-white">White</option>
          <option value="bg-black">Black</option>
        </select>
      </div>
    </div>
    <div class="px-4 py-2 border-b flex justify-end gap-2 bg-gray-50">
      <button id="settings-cancel" class="px-3 py-1 bg-white border rounded cursor-pointer">Cancel</button>
      <button id="settings-save" class="px-3 py-1 bg-blue-600 text-white rounded cursor-pointer">Save</button>
    </div>
  </div>
</div>

<script src="url.js"></script>
<script>
'use strict';

const Storage = {
  db: null,
  init() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('WebTermDB', 200);
      r.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('vfs')) db.createObjectStore('vfs');
        if (!db.objectStoreNames.contains('system')) db.createObjectStore('system');
      };
      r.onsuccess = e => { this.db = e.target.result; res(); };
      r.onerror = e => rej(e.target.error);
    });
  },
  _t(s, m) { return this.db.transaction(s, m).objectStore(s); },
  get(k, s = 'vfs') { return new Promise((res, rej) => {
    const r = this._t(s, 'readonly').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  set(k, v, s = 'vfs') { return new Promise((res, rej) => {
    const r = this._t(s, 'readwrite').put(v, k); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); },
  remove(k, s = 'vfs') { return new Promise((res, rej) => {
    const r = this._t(s, 'readwrite').delete(k); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); },
  keys(s = 'vfs') { return new Promise((res, rej) => {
    const r = this._t(s, 'readonly').getAllKeys(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
};

const Utils = {
  escapeHTML(s) { return String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); },
  generateId() { return Math.random().toString(36).substring(2, 9); },
  resolvePath(cwd, p) {
    if (!p) return cwd;
    const parts = p.startsWith('/') ? p.split('/') : cwd.split('/').concat(p.split('/'));
    const r = [];
    for (const x of parts) {
      if (!x || x === '.') continue;
      if (x === '..') { if (r.length) r.pop(); } else r.push(x);
    }
    return '/' + r.join('/');
  },
  formatSize(b) {
    if (!b) return '0 B';
    const k = 1024, u = ['B','KB','MB','GB'];
    const i = Math.floor(Math.log(b) / Math.log(k));
    return (b / Math.pow(k, i)).toFixed(2) + ' ' + u[i];
  },
  truncate(s, n = 2000) {
    const x = String(s);
    return x.length > n ? x.slice(0, n) + '...' : x;
  },
};

function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem('webterm_settings') || '{}');
    return {
      username: (typeof s.username === 'string' && s.username.trim()) ? s.username : 'user',
      fontColor: ['text-black','text-white','text-green-600'].includes(s.fontColor) ? s.fontColor : 'text-black',
      bgColor: ['bg-white','bg-black'].includes(s.bgColor) ? s.bgColor : 'bg-white',
    };
  } catch (e) {
    return { username: 'user', fontColor: 'text-black', bgColor: 'bg-white' };
  }
}
const state = { session: null, settings: loadSettings() };

// ---------------- Aliases ----------------
let keyAliases = {};
let cmdAliases = {};
(function () {
  try {
    keyAliases = JSON.parse(localStorage.getItem('webterm_key_aliases') || '{}');
    cmdAliases = JSON.parse(localStorage.getItem('webterm_cmd_aliases') || '{}');
  } catch (e) { keyAliases = {}; cmdAliases = {}; }
})();
function saveAliases() {
  try {
    localStorage.setItem('webterm_key_aliases', JSON.stringify(keyAliases));
    localStorage.setItem('webterm_cmd_aliases', JSON.stringify(cmdAliases));
  } catch (e) {}
}

// ---------------- Terminal core ----------------
const Terminal = {
  version: '2.2.0',
  commands: {},
  extensions: {},
  runners: {},
  session: null,
  Storage, Utils,
  registerExtension(spec) {
    if (!spec || !spec.name) throw new Error('Extension must have a name');
    if (this.extensions[spec.name]) throw new Error('Extension already registered: ' + spec.name);
    this.extensions[spec.name] = spec;
    for (const [cmd, fn] of Object.entries(spec.commands || {})) {
      if (typeof fn !== 'function') continue;
      this.commands[cmd.toUpperCase()] = fn;
    }
    for (const [ext, fn] of Object.entries(spec.runners || {})) {
      if (typeof fn !== 'function') continue;
      this.runners[ext.toLowerCase()] = fn;
    }
  },
  unregisterExtension(name) {
    const spec = this.extensions[name];
    if (!spec) return;
    for (const c of Object.keys(spec.commands || {})) delete this.commands[c.toUpperCase()];
    for (const e of Object.keys(spec.runners || {})) delete this.runners[e.toLowerCase()];
    delete this.extensions[name];
  },
  async sha256(text) {
    const buf = new TextEncoder().encode(text);
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
  },
  print(t)       { if (this.session) this.session.print(t); },
  printSystem(t) { if (this.session) this.session.printSystem(t); },
  printError(t)  { if (this.session) this.session.printError(t); },
  printSuccess(t){ if (this.session) this.session.printSuccess(t); },
  get cwd()      { return this.session ? this.session.cwd : '/home/user'; },
  getUsername()  { return state.settings.username; },
};
window.Terminal = Terminal;

// ---------------- Extension manager ----------------
const ExtensionManager = {
  get baseUrl() { return window.URLS.base; },

  resolveUrl(path) {
    if (/^[a-z][a-z0-9+.-]*:/i.test(path)) return path;
    return new URL(path, this.baseUrl).href;
  },

  async loadRegistry(url, refresh = false) {
    const absUrl = this.resolveUrl(url);
    const cacheKey = 'reg_' + absUrl.split('/').pop().split('?')[0];
    if (!refresh) {
      const cached = await Storage.get(cacheKey, 'system');
      if (cached) return cached;
    }
    const fetchUrl = absUrl + (absUrl.includes('?') ? '&' : '?') + 'v=' + Terminal.version;
    try {
      const r = await fetch(fetchUrl, { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const text = await r.text();
      if (text.trim().toLowerCase().startsWith('<!doctype html>') || text.trim().toLowerCase().startsWith('<html')) {
         throw new Error('File not found (404)');
      }
      const data = JSON.parse(text);
      await Storage.set(cacheKey, data, 'system');
      return data;
    } catch (e) {
      const cached = await Storage.get(cacheKey, 'system');
      if (cached) return cached;
      throw new Error('Registry unavailable: ' + e.message);
    }
  },

  async installPkg(name, onProgress) {
    const reg = await this.loadRegistry(window.URLS.pkgRegistry, true);
    const entry = reg.extensions.find(x => x.name.toLowerCase() === name.toLowerCase());
    if (!entry) throw new Error('unknown package');
    const relPath = (window.URLS.pkg || {})[entry.name.toLowerCase()];
    if (!relPath) throw new Error('No URL configured for package: ' + entry.name);
    if (onProgress) onProgress('Downloading package ' + entry.name + '...');
    const absUrl = this.resolveUrl(relPath);
    const fetchUrl = absUrl + (absUrl.includes('?') ? '&' : '?') + 'v=' + Terminal.version;
    const r = await fetch(fetchUrl, { cache: 'no-store' });
    if (!r.ok) throw new Error('Download failed: HTTP ' + r.status);
    const code = await r.text();
    if (code.trim().toLowerCase().startsWith('<!doctype html>') || code.trim().toLowerCase().startsWith('<html')) {
      throw new Error('File not found on server (404)');
    }
    if (entry.sha256 && entry.sha256.length > 0) {
      const hash = await Terminal.sha256(code);
      if (hash !== entry.sha256) throw new Error('Integrity check failed for ' + entry.name);
    }
    if (Terminal.extensions[entry.name]) Terminal.unregisterExtension(entry.name);
    new Function('Terminal', code)(Terminal);
    if (!Terminal.extensions[entry.name]) throw new Error('Extension failed to register: ' + entry.name);
    Terminal.extensions[entry.name].type = 'pkg';
    await Storage.set('ext:' + entry.name, code, 'system');
    await Storage.set('ext_type:' + entry.name, 'pkg', 'system');
    const extObj = Terminal.extensions[entry.name];
    return { name: entry.name, info: (extObj && extObj.info) || 'Package installed successfully.' };
  },

  async installMaster(name, onProgress) {
    if (Terminal.extensions[name]) throw new Error('Master key is already imported.');
    const reg = await this.loadRegistry(window.URLS.masterRegistry, true);
    const entry = reg.extensions.find(x => x.name.toLowerCase() === name.toLowerCase());
    if (!entry) throw new Error('unknown master key');
    const relPath = (window.URLS.master || {})[entry.name.toLowerCase()];
    if (!relPath) throw new Error('No URL configured for master key: ' + entry.name);
    if (onProgress) onProgress('Importing master key ' + entry.name + '...');
    const absUrl = this.resolveUrl(relPath);
    const fetchUrl = absUrl + (absUrl.includes('?') ? '&' : '?') + 'v=' + Terminal.version;
    const r = await fetch(fetchUrl, { cache: 'no-store' });
    if (!r.ok) throw new Error('Import failed: HTTP ' + r.status);
    const code = await r.text();
    if (code.trim().toLowerCase().startsWith('<!doctype html>') || code.trim().toLowerCase().startsWith('<html')) {
      throw new Error('File not found on server (404)');
    }
    if (entry.sha256 && entry.sha256.length > 0) {
      const hash = await Terminal.sha256(code);
      if (hash !== entry.sha256) throw new Error('Integrity check failed for ' + entry.name);
    }
    new Function('Terminal', code)(Terminal);
    if (!Terminal.extensions[entry.name]) throw new Error('Master key failed to register: ' + entry.name);
    Terminal.extensions[entry.name].type = 'master';
    const extObj = Terminal.extensions[entry.name];
    return { name: entry.name, info: (extObj && extObj.info) || 'Master Key imported successfully.' };
  },

  async remove(name) {
    const actualName = Object.keys(Terminal.extensions).find(k => k.toLowerCase() === name.toLowerCase());
    if (actualName) {
      Terminal.unregisterExtension(actualName);
      await Storage.remove('ext:' + actualName, 'system');
      await Storage.remove('ext_type:' + actualName, 'system');
    }
  },

  async loadAll() {
    const keys = await Storage.keys('system');
    for (const key of keys) {
      if (typeof key !== 'string' || !key.startsWith('ext:')) continue;
      const name = key.slice(4);
      const code = await Storage.get(key, 'system');
      const type = await Storage.get('ext_type:' + name, 'system');
      if (!code || type !== 'pkg') continue;
      try {
        new Function('Terminal', code)(Terminal);
        if (Terminal.extensions[name]) Terminal.extensions[name].type = type;
      } catch (e) {
        console.warn('Failed to load ' + name + ': ' + e.message);
      }
    }
  },
};
window.ExtensionManager = ExtensionManager;

// ---------------- Command registry (for @key) ----------------
const COMMAND_REGISTRY = [
  { category: 'Core', commands: [
    { usage: '@key', description: 'Show this list' },
    { usage: '@sys', description: 'System info + open settings' },
    { usage: '@user', description: 'Open settings' },
    { usage: '@ver', description: 'Show version' },
    { usage: 'clear', description: 'Clear screen + unload master keys' }
  ]},
  { category: 'Navigation', commands: [
    { usage: '?', description: 'Show current location' },
    { usage: 'go <folder>', description: 'Enter a folder' },
    { usage: '..go', description: 'Go up one level' },
    { usage: '**', description: 'List files in current folder' },
    { usage: '*', description: 'List files + extensions' }
  ]},
  { category: 'Files', commands: [
    { usage: 'cre <file>', description: 'Create empty file' },
    { usage: 'create <folder>', description: 'Create folder' },
    { usage: 'del(<name>)', description: 'Delete file/folder' },
    { usage: 'del(*)', description: 'Delete all files' },
    { usage: 'edit <name>', description: 'Edit file content/name or folder name' }
  ]},
  { category: 'Import / Export', commands: [
    { usage: 'in()', description: 'Import files from device' },
    { usage: 'in{<name|url>}', description: 'Install package or download URL' },
    { usage: 'inx()', description: 'Export VFS backup' },
    { usage: 'inx{<file>}', description: 'Export file to device' }
  ]},
  { category: 'Extensions', commands: [
    { usage: 'inx.<name>', description: 'Import master key' },
    { usage: 'del{<name>}', description: 'Remove a package' },
    { usage: 'del{*}', description: 'Remove all packages' },
    { usage: '@master_key', description: 'List available master keys' },
    { usage: '@pkg', description: 'List available packages' }
  ]},
  { category: 'Execution', commands: [
    { usage: 'RUN{<pkg>}', description: 'Run a package' },
    { usage: 'RUN(<file>)', description: 'Run a file' }
  ]},
  { category: 'Aliases', commands: [
    { usage: '<key> asa <alias>', description: 'Alias a key' },
    { usage: '[<cmd>] ass <alias>', description: 'Alias a full command' },
    { usage: 'asa', description: 'List key aliases' },
    { usage: 'ass', description: 'List command aliases' }
  ]},
  { category: 'Misc', commands: [
    { usage: 'cmd1 & cmd2', description: 'Chain commands' },
    { usage: 'date', description: 'Show current date' },
    { usage: 'time', description: 'Show current time' }
  ]}
];

// ---------------- Session ----------------
class TerminalSession {
  constructor() {
    this.cwd = '/home/' + state.settings.username;
    this.history = [];
    this.historyIndex = -1;
    this.mode = 'shell';
    this.replBuffer = [];
    this.executing = false;
    this.closed = false;
    this.promptPrefix = '';

    this.container = document.createElement('div');
    this.container.className = 'term absolute inset-0 overflow-y-auto p-4 flex flex-col ' + state.settings.fontColor;
    this.out = document.createElement('div');
    this.out.className = 'flex flex-col whitespace-pre-wrap break-all';

    this.inputContainer = document.createElement('div');
    this.inputContainer.className = 'flex items-center mt-1';

    this.promptEl = document.createElement('span');
    this.promptEl.className = 'mr-2 font-bold whitespace-pre';
    this.lineEl = document.createElement('span');
    this.lineEl.className = 'whitespace-pre';
    this.cursor = document.createElement('span');
    this.cursor.className = 'cursor-block';

    this.inputContainer.append(this.promptEl, this.lineEl, this.cursor);
    this.container.append(this.out, this.inputContainer);
    document.getElementById('workspace').appendChild(this.container);
    this.updatePrompt();
  }

  updatePrompt() {
    if (['python', 'python_input', 'sql'].includes(this.mode)) {
      this.promptEl.innerHTML = '<span>' + Utils.escapeHTML(this.promptPrefix) + '</span>';
    } else {
      let displayPath = state.settings.username;
      const home = `/home/${state.settings.username}`;
      if (this.cwd === '/') displayPath = '/';
      else if (this.cwd !== home) {
        if (this.cwd.startsWith(home + '/')) displayPath += '/' + this.cwd.slice(home.length + 1);
        else displayPath = this.cwd;
      }
      this.promptEl.innerHTML = `<span class="font-bold">${Utils.escapeHTML(displayPath)}:</span>`;
    }
  }

  print(html, isHtml = false) {
    const isAtBottom = this.container.scrollHeight - this.container.scrollTop - this.container.clientHeight < 60;
    const d = document.createElement('div');
    d.className = 'mb-1';
    if (isHtml) d.innerHTML = html; else d.textContent = html;
    this.out.appendChild(d);
    if (isAtBottom) this.container.scrollTop = this.container.scrollHeight;
  }
  printSystem(t) { this.print('<span class="text-blue-600">' + Utils.escapeHTML(t) + '</span>', true); }
  printError(t)  { this.print('<span class="text-red-600">' + Utils.escapeHTML(t) + '</span>', true); }
  printSuccess(t){ this.print('<span class="text-yellow-600">' + Utils.escapeHTML(t) + '</span>', true); }

  clear() { this.out.innerHTML = ''; }

  updateLine() {
    this.lineEl.textContent = document.getElementById('capture').value;
    this.updatePrompt();
  }

  async processInput(input) {
    const cap = document.getElementById('capture');
    if (this.mode === 'python_input') {
      this.print(this.promptEl.innerHTML + Utils.escapeHTML(input), true);
      if (this._inputResolver) { this._inputResolver(input); this._inputResolver = null; }
      this.mode = 'python';
      this.promptPrefix = '>>> ';
      this.updatePrompt();
      cap.disabled = false; cap.focus();
      return;
    }

    const trimmed = input.trim();
    if (!trimmed) return;

    if (this.mode === 'shell' || this.mode === 'python' || this.mode === 'sql') {
       this.print(this.promptEl.innerHTML + ' ' + Utils.escapeHTML(input), true);
    }
    if (input.trim()) { this.history.push(input); this.historyIndex = this.history.length; }

    if (this.mode === 'python') {
      const up = trimmed.toUpperCase();
      if (['EXIT', 'EXIT()', 'QUIT', 'QUIT()', 'EXIT(0)'].includes(up)) {
        this.mode = 'shell'; this.replBuffer = []; this.promptPrefix = '';
        this.updatePrompt(); return;
      }
      this.replBuffer.push(input);
      if (Terminal.commands['__PYTHON_EVAL__']) {
        try { await Terminal.commands['__PYTHON_EVAL__'].call(this, this.replBuffer); }
        catch (e) { this.printError(e.message || String(e)); }
      }
      return;
    }

    if (this.mode === 'sql') {
      const up = trimmed.toUpperCase();
      if (['EXIT', 'QUIT'].includes(up)) {
        this.mode = 'shell'; this.promptPrefix = ''; this.updatePrompt(); return;
      }
      if (Terminal.commands['__SQL_EVAL__']) {
        try { await Terminal.commands['__SQL_EVAL__'].call(this, input); }
        catch (e) { this.printError(e.message || String(e)); }
      }
      return;
    }

    if (trimmed.includes('&')) {
      const parts = trimmed.split('&');
      for (const p of parts) if (p.trim()) await this.executeKey(p.trim());
      return;
    }
    await this.executeKey(trimmed);
  }

  async executeKey(input) {
    input = input.trim();
    if (!input) return;

    // Alias definitions
    let m = input.match(/^\[(.+)\]\s+(?:asa|ass)\s+(\S+)$/i);
    if (m) {
      cmdAliases[m[2]] = m[1].trim();
      saveAliases();
      this.printSuccess('Command alias: ' + m[2] + ' = [' + m[1] + ']');
      return;
    }
    m = input.match(/^(\S+)\s+(?:asa|ass)\s+(\S+)$/i);
    if (m) {
      keyAliases[m[2]] = m[1];
      saveAliases();
      this.printSuccess('Key alias: ' + m[2] + ' = ' + m[1]);
      return;
    }

    // Resolve aliases
    if (cmdAliases[input]) {
      input = cmdAliases[input];
    } else {
      const w = input.match(/^(\S+)(\s+.*)?$/);
      if (w && keyAliases[w[1]]) input = keyAliases[w[1]] + (w[2] || '');
    }

    const upperInput = input.toUpperCase();
    if (upperInput === 'PYTHON') { this.printError('Unknown Key: python'); return; }
    if (upperInput === 'SQL')    { this.printError('Unknown Key: sql'); return; }

    // in() -> device import
    if (/^in\(\s*\)$/i.test(input) || /^in$/i.test(input)) {
      try { await this.cmdInImport(); } catch (e) { this.printError(e.message || String(e)); }
      return;
    }

    // in{...} -> install or download URL
    m = input.match(/^in\{\s*(.+?)\s*\}$/i);
    if (m) {
      try { await this.cmdInInstall(m[1]); } catch (e) { this.printError(e.message || String(e)); }
      return;
    }

    // inx() -> export all
    if (/^inx\(\s*\)$/i.test(input) || /^inx$/i.test(input)) {
      try { await this.cmdInxExportAll(); } catch (e) { this.printError(e.message || String(e)); }
      return;
    }

    // inx{...} -> export file
    m = input.match(/^inx\{\s*(.+?)\s*\}$/i);
    if (m) {
      try { await this.cmdInxExportFile(m[1]); } catch (e) { this.printError(e.message || String(e)); }
      return;
    }

    // inx.master_key
    m = input.match(/^inx\.([a-zA-Z0-9_]+)$/i);
    if (m) {
      try { await this.handleInxMaster(m[1].trim()); } catch (e) { this.printError(e.message || String(e)); }
      return;
    }

    // del(...) -> delete file
    m = input.match(/^del\(\s*(.+?)\s*\)$/i);
    if (m) {
      try {
        if (m[1] === '*') await this.cmdDelAllFiles();
        else await this.cmdDelFile(m[1]);
      } catch (e) { this.printError(e.message || String(e)); }
      return;
    }

    // del{...} -> delete package
    m = input.match(/^del\{\s*(.+?)\s*\}$/i);
    if (m) {
      try {
        if (m[1] === '*') await this.cmdDelAllPkgs();
        else await this.cmdDelPkg(m[1]);
      } catch (e) { this.printError(e.message || String(e)); }
      return;
    }

    // RUN{...}
    m = input.match(/^RUN\{\s*(.+?)\s*\}$/i);
    if (m) { await this.cmdRunPkg(m[1].trim()); return; }

    // RUN(...)
    m = input.match(/^RUN\(\s*(.+?)\s*\)$/i);
    if (m) {
      try { await this.cmdRunFile(m[1].trim()); }
      catch (e) { this.printError(e.message || String(e)); }
      return;
    }

    // Fallback: first word dispatch
    const parts = input.split(/\s+/);
    const cmdName = parts[0].toUpperCase();
    const arg = parts.slice(1).join(' ');

    if (CORE_HANDLERS[cmdName]) {
      try { await CORE_HANDLERS[cmdName].call(this, arg); }
      catch (e) { this.printError(e.message || String(e)); }
      return;
    }
    if (Terminal.commands[cmdName]) {
      try { await Terminal.commands[cmdName].call(this, arg); }
      catch (e) { this.printError(e.message || String(e)); }
      return;
    }
    this.printError('Unknown Key: ' + input);
  }

  // --- in() : import from device ---
  async cmdInImport() {
    if (!window.showOpenFilePicker) throw new Error('File System Access API not supported.');
    try {
      const files = await window.showOpenFilePicker({ multiple: true });
      for (const handle of files) {
        const file = await handle.getFile();
        const content = await file.text();
        const vfsPath = Utils.resolvePath(this.cwd, handle.name);
        await Storage.set(vfsPath, { type: 'file', content: content }, 'vfs');
        this.printSuccess('Imported: ' + handle.name);
      }
    } catch (e) {
      if (e.name === 'AbortError') throw new Error('File selection aborted.');
      throw e;
    }
  }

  // --- in{...} : install package or download URL ---
  async cmdInInstall(arg) {
    if (/^https?:\/\//i.test(arg)) {
      const id = Utils.generateId();
      this.print('<span id="' + id + '" class="text-blue-600">Downloading...</span>', true);
      try {
        const r = await fetch(arg);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const blob = await r.blob();
        const filename = (arg.split('/').pop() || 'file').split('?')[0] || 'downloaded_file';
        const vfsPath = Utils.resolvePath(this.cwd, filename);
        let content = '[Binary File: ' + blob.size + ' bytes]';
        if (blob.type.startsWith('text/') || filename.match(/\.(txt|md|js|json|css|html|py|sql)$/i)) content = await blob.text();
        await Storage.set(vfsPath, { type: 'file', content: content }, 'vfs');
        const el = document.getElementById(id);
        if (el) { el.className = 'text-yellow-600'; el.textContent = 'Saved to: ' + vfsPath; }
      } catch (e) {
        const el = document.getElementById(id);
        if (el) { el.className = 'text-red-600'; el.textContent = 'Failed: ' + e.message; }
      }
      return;
    }
    const id = Utils.generateId();
    this.print('<span id="' + id + '" class="text-blue-600">Installing ' + Utils.escapeHTML(arg) + '...</span>', true);
    try {
      const res = await ExtensionManager.installPkg(arg, msg => {
        const el = document.getElementById(id); if (el) el.textContent = msg;
      });
      const el = document.getElementById(id);
      if (el) { el.className = 'text-yellow-600'; el.textContent = res.info; }
    } catch (e) {
      const el = document.getElementById(id);
      if (el) { el.className = 'text-red-600'; el.textContent = 'Install failed: ' + e.message; }
    }
  }

  // --- inx() : export all VFS as JSON ---
  async cmdInxExportAll() {
    const all = await Storage.keys('vfs');
    const data = {};
    for (const k of all) data[k] = await Storage.get(k, 'vfs');
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'vfs-backup-' + Date.now() + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    this.printSuccess('Exported VFS backup.');
  }

  // --- inx{file} : export one file ---
  async cmdInxExportFile(filename) {
    const target = Utils.resolvePath(this.cwd, filename);
    const entry = await Storage.get(target, 'vfs');
    if (!entry || entry.type !== 'file') throw new Error('Not a file: ' + filename);
    const blob = new Blob([entry.content || ''], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename.split('/').pop();
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    this.printSuccess('Exported: ' + filename);
  }

  // --- del(file/folder) ---
  async cmdDelFile(name) {
    const t = Utils.resolvePath(this.cwd, name);
    const prot = new Set(['/', '/home', '/home/' + state.settings.username]);
    if (prot.has(t)) throw new Error('Core folder is protected.');
    const e = await Storage.get(t, 'vfs');
    if (!e) throw new Error('Not found: ' + name);
    if (e.type === 'dir') {
      const all = await Storage.keys('vfs');
      for (const k of all) if (k.startsWith(t + '/')) await Storage.remove(k, 'vfs');
    }
    await Storage.remove(t, 'vfs');
    this.printSuccess('Deleted: ' + name);
  }

  // --- del(*) : delete all files (protect core) ---
  async cmdDelAllFiles() {
    const all = await Storage.keys('vfs');
    const prot = new Set(['/', '/home', '/home/' + state.settings.username]);
    let count = 0;
    for (const k of all) if (!prot.has(k)) { await Storage.remove(k, 'vfs'); count++; }
    this.printSuccess('Deleted ' + count + ' items.');
  }

  // --- del{pkg} ---
  async cmdDelPkg(name) {
    const actualName = Object.keys(Terminal.extensions).find(k => k.toLowerCase() === name.toLowerCase());
    if (!actualName) throw new Error('Not installed: ' + name);
    await ExtensionManager.remove(actualName);
    this.printSuccess('Removed package: ' + actualName);
  }

  // --- del{*} : delete all packages ---
  async cmdDelAllPkgs() {
    for (const extName of Object.keys(Terminal.extensions)) Terminal.unregisterExtension(extName);
    const extKeys = await Storage.keys('system');
    for (const k of extKeys) {
      if (typeof k === 'string' && k.startsWith('ext:')) {
        const extName = k.slice(4);
        await Storage.remove(k, 'system');
        await Storage.remove('ext_type:' + extName, 'system');
      }
    }
    this.printSuccess('All packages removed.');
  }

  // --- inx.master_key ---
  async handleInxMaster(name) {
    const lower = name.toLowerCase();
    const existing = Object.keys(Terminal.extensions).find(k => k.toLowerCase() === lower);
    if (existing) { this.printSystem(name + ' is already imported.'); return; }
    const id = Utils.generateId();
    this.print('<span id="' + id + '" class="text-blue-600">Importing master key ' + Utils.escapeHTML(name) + '...</span>', true);
    try {
      const res = await ExtensionManager.installMaster(name, msg => {
        const el = document.getElementById(id); if (el) el.textContent = msg;
      });
      const el = document.getElementById(id);
      if (el) { el.className = 'text-yellow-600'; el.textContent = res.info; }
    } catch (e) {
      const el = document.getElementById(id);
      if (el) { el.className = 'text-red-600'; el.textContent = 'Import failed: ' + e.message; }
    }
  }

  // --- RUN{pkg} ---
  async cmdRunPkg(pkg) {
    pkg = pkg.toLowerCase();
    const ext = Object.values(Terminal.extensions).find(e => e.name.toLowerCase() === pkg);
    if (!ext || typeof ext.run !== 'function') {
      if (Terminal.commands[pkg.toUpperCase()]) {
        this.promptEl.innerHTML = `<span class="text-blue-600">${Utils.escapeHTML(pkg)}</span>`;
        this.lineEl.textContent = '';
        this.cursor.style.display = 'none';
        try { await Terminal.commands[pkg.toUpperCase()].call(this); }
        catch(e) { this.printError(e.message || String(e)); }
        finally { this.cursor.style.display = ''; this.updatePrompt(); }
      } else {
        this.printError('Unknown Package: ' + pkg);
      }
      return;
    }
    let dots = 0;
    const loadingInterval = setInterval(() => {
      this.promptEl.innerHTML = `<span class="text-blue-600">${Utils.escapeHTML(pkg)}${'.'.repeat(dots % 3 + 1)}</span>`;
      dots++;
    }, 300);
    this.lineEl.textContent = '';
    this.cursor.style.display = 'none';
    try { await ext.run(this); }
    catch (e) { this.printError(e.message || String(e)); }
    finally {
      clearInterval(loadingInterval);
      this.cursor.style.display = '';
      if (this.mode === 'shell') this.updatePrompt();
    }
  }

  // --- RUN(file) ---
  async cmdRunFile(arg) {
    if (!arg) throw new Error('Usage: RUN(filename)');
    const filename = arg.split('/').pop();
    const dotIdx = filename.lastIndexOf('.');
    const ext = dotIdx > 0 ? '.' + filename.slice(dotIdx + 1).toLowerCase() : '';
    const target = Utils.resolvePath(this.cwd, arg);
    const entry = await Storage.get(target, 'vfs');
    if (!entry || entry.type !== 'file') throw new Error('File not found: ' + arg);
    const content = entry.content;

    if (ext && Terminal.runners[ext]) return Terminal.runners[ext].call(this, filename, content);
    if (ext === '.js' || ext === '.mjs') return this._execJS(content);
    if (ext === '.html' || ext === '.htm') return this._execHTML(filename, content);
    if (ext === '.css') return this._execCSS(filename, content);
    if (ext === '.json') {
      try { this.printSystem(JSON.stringify(JSON.parse(content), null, 2)); }
      catch (e) { this.printError('Invalid JSON: ' + e.message); }
      return;
    }
    this.print(content);
  }

  async _execJS(code) {
    const wCode = `
      const logs = [];
      for (const k of ['log','warn','error','info','debug']) {
        console[k] = (...a) => logs.push('[' + k + '] ' + a.map(x => {
          try { return typeof x === 'object' ? JSON.stringify(x) : String(x); }
          catch (_) { return String(x); }
        }).join(' '));
      }
      self.onmessage = async e => {
        try {
          const r = await eval(e.data);
          let result;
          try {
            result = (r === undefined || r === null) ? ''
                   : (typeof r === 'object' ? JSON.stringify(r) : String(r));
          } catch (_) { result = String(r); }
          self.postMessage({ ok: true, result, logs });
        } catch (err) {
          self.postMessage({ ok: false, error: err.message || String(err), logs });
        }
      };
    `;
    const blob = new Blob([wCode], { type: 'application/javascript' });
    const url = URL.createObjectURL(blob);
    const w = new Worker(url);
    return new Promise(res => {
      let done = false;
      const finish = d => {
        if (done) return; done = true;
        clearTimeout(t);
        try { w.terminate(); } catch (e) {}
        URL.revokeObjectURL(url);
        if (d.logs) d.logs.forEach(l => this.printSystem(Utils.truncate(l)));
        if (!d.ok) this.printError('Error: ' + d.error);
        else if (d.result && d.result !== 'undefined') this.printSystem('Result: ' + Utils.truncate(d.result));
        res();
      };
      const t = setTimeout(() => finish({ ok: false, error: 'Timeout (10s)', logs: [] }), 10000);
      w.onmessage = e => finish(e.data);
      w.onerror = e => finish({ ok: false, error: e.message || 'Worker crashed', logs: [] });
      w.postMessage(code);
    });
  }

  _execHTML(filename, content) {
    const blob = new Blob([content], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const w = window.open(url, '_blank');
    if (!w) this.printError('Popup blocked; allow popups to preview.');
    else this.printSuccess('Opened ' + filename + ' in a new tab.');
  }

  _execCSS(filename, content) {
    const html = '<!DOCTYPE html><html><head><style>' + content + '</style></head><body>' +
      '<h1>CSS Preview</h1><p>Paragraph <a href="#">link</a></p>' +
      '<button>Button</button><div style="padding:12px;border:1px solid #ccc;margin-top:12px;">Box</div></body></html>';
    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const w = window.open(url, '_blank');
    if (!w) this.printError('Popup blocked; allow popups to preview.');
    else this.printSuccess('Opened ' + filename + ' preview.');
  }
}

// ---------------- Core handlers ----------------
const CORE_HANDLERS = {
  '@USER'() { UI.openSettings(); },

  '@SYS'() {
    const ua = navigator.userAgent;
    let os = 'Unknown';
    if (/Windows/.test(ua)) os = 'Windows';
    else if (/Mac OS/.test(ua)) os = 'macOS';
    else if (/Android/.test(ua)) os = 'Android';
    else if (/iPhone|iPad/.test(ua)) os = 'iOS';
    else if (/Linux/.test(ua)) os = 'Linux';

    let browser = 'Unknown';
    if (/Edg\//.test(ua)) browser = 'Edge';
    else if (/Chrome\//.test(ua)) browser = 'Chrome';
    else if (/Firefox\//.test(ua)) browser = 'Firefox';
    else if (/Safari\//.test(ua)) browser = 'Safari';

    const mem = performance.memory ? (performance.memory.usedJSHeapSize / 1048576).toFixed(2) + ' MB' : 'N/A';
    const up = Math.floor(performance.now() / 1000);
    const upm = Math.floor(up / 60);

    this.printSystem('OS: ' + os);
    this.printSystem('Browser: ' + browser);
    this.printSystem('User: ' + state.settings.username);
    this.printSystem('Memory: ' + mem);
    this.printSystem('Uptime: ' + upm + 'm ' + (up % 60) + 's');
    UI.openSettings();
  },

  '@VER'() { this.printSystem('Browser Terminal Version: ' + Terminal.version); },

  CLEAR() {
    this.clear();
    for (const name of Object.keys(Terminal.extensions)) {
      if (Terminal.extensions[name].type === 'master') Terminal.unregisterExtension(name);
    }
  },

  '@KEY'() {
    for (const g of COMMAND_REGISTRY) {
      this.printSystem('[' + g.category + ']');
      for (const c of g.commands) this.printSystem('  ' + c.usage.padEnd(28) + c.description);
    }
  },

  '@MASTER_KEY'() {
    return (async () => {
      try {
        this.printSystem('Fetching available master keys...');
        const reg = await ExtensionManager.loadRegistry(window.URLS.masterRegistry, true);
        this.printSystem('[Available Master Keys]');
        for (const e of reg.extensions) this.printSystem('  ' + e.name.padEnd(14) + ' v' + e.version + ' - ' + e.description);
      } catch(e) { this.printError('Could not load master_key.json: ' + e.message); }
    })();
  },

  '@PKG'() {
    return (async () => {
      try {
        this.printSystem('Fetching available packages...');
        const reg = await ExtensionManager.loadRegistry(window.URLS.pkgRegistry, true);
        this.printSystem('[Available Packages]');
        for (const e of reg.extensions) this.printSystem('  ' + e.name.padEnd(14) + ' v' + e.version + ' - ' + e.description);
      } catch(e) { this.printError('Could not load pkg.json: ' + e.message); }
    })();
  },

  '?'() { this.printSystem(this.cwd); },

  '*'() {
    return (async () => {
      this.printSystem('[Files]');
      const all = await Storage.keys('vfs');
      const pfx = this.cwd === '/' ? '/' : this.cwd + '/';
      const firsts = new Set();
      for (const k of all) {
        if (k.startsWith(pfx) && k !== this.cwd) firsts.add(k.slice(pfx.length).split('/')[0]);
      }
      const items = [];
      for (const n of firsts) {
        const e = await Storage.get(pfx + n, 'vfs');
        items.push([n, e || { type: 'file' }]);
      }
      items.sort((a, b) => a[0].localeCompare(b[0]));
      if (!items.length) this.printSystem('  (empty)');
      else for (const [n, e] of items) {
        if (e.type === 'dir') this.printSystem('  ' + n + '/');
        else this.printSystem('  ' + n + '  (' + Utils.formatSize((e.content || '').length) + ')');
      }

      const masters = Object.values(Terminal.extensions).filter(e => e.type === 'master');
      this.printSystem('[Installed Master Keys]');
      if (!masters.length) this.printSystem('  (none)');
      for (const e of masters) this.printSystem('  ' + e.name);

      const pkgs = Object.values(Terminal.extensions).filter(e => e.type === 'pkg');
      this.printSystem('[Installed Packages]');
      if (!pkgs.length) this.printSystem('  (none)');
      for (const e of pkgs) this.printSystem('  ' + e.name);
    })();
  },

  '**'() {
    return (async () => {
      const all = await Storage.keys('vfs');
      const pfx = this.cwd === '/' ? '/' : this.cwd + '/';
      const firsts = new Set();
      for (const k of all) {
        if (k.startsWith(pfx) && k !== this.cwd) firsts.add(k.slice(pfx.length).split('/')[0]);
      }
      const items = [];
      for (const n of firsts) {
        const e = await Storage.get(pfx + n, 'vfs');
        items.push([n, e || { type: 'file' }]);
      }
      items.sort((a, b) => a[0].localeCompare(b[0]));
      if (!items.length) this.printSystem('  (empty)');
      else for (const [n, e] of items) {
        if (e.type === 'dir') this.printSystem('  ' + n + '/');
        else this.printSystem('  ' + n + '  (' + Utils.formatSize((e.content || '').length) + ')');
      }
    })();
  },

  'ASA'() {
    const keys = Object.keys(keyAliases);
    if (!keys.length) { this.printSystem('(no key aliases)'); return; }
    this.printSystem('[Key aliases]');
    for (const k of keys) this.printSystem('  ' + k + ' = ' + keyAliases[k]);
  },

  'ASS'() {
    const keys = Object.keys(cmdAliases);
    if (!keys.length) { this.printSystem('(no command aliases)'); return; }
    this.printSystem('[Command aliases]');
    for (const k of keys) this.printSystem('  ' + k + ' = [' + cmdAliases[k] + ']');
  },

  'GO'(arg) {
    const name = arg ? arg.trim() : '';
    if (!name) throw new Error('Usage: go <folder>');
    return (async () => {
      const t = Utils.resolvePath(this.cwd, name);
      const e = await Storage.get(t, 'vfs');
      if (!e || e.type !== 'dir') throw new Error('Not a folder: ' + name);
      this.cwd = t; this.updatePrompt();
    })();
  },

  '..GO'() { this.cwd = Utils.resolvePath(this.cwd, '..'); this.updatePrompt(); },

  CRE(arg) {
    const name = arg ? arg.trim() : '';
    if (!name) throw new Error('Usage: cre <filename>');
    return (async () => {
      const t = Utils.resolvePath(this.cwd, name);
      if (await Storage.get(t, 'vfs')) throw new Error('Already exists: ' + name);
      await Storage.set(t, { type: 'file', content: '' }, 'vfs');
      this.printSuccess('File created: ' + name);
    })();
  },

  CREATE(arg) {
    const name = arg ? arg.trim() : '';
    if (!name) throw new Error('Usage: create <folder>');
    return (async () => {
      const t = Utils.resolvePath(this.cwd, name);
      if (await Storage.get(t, 'vfs')) throw new Error('Already exists: ' + name);
      await Storage.set(t, { type: 'dir' }, 'vfs');
      this.printSuccess('Folder created: ' + name);
    })();
  },

  EDIT(arg) {
    const name = arg ? arg.trim() : '';
    if (!name) throw new Error('Usage: edit <name>');
    return (async () => {
      const t = Utils.resolvePath(this.cwd, name);
      const e = await Storage.get(t, 'vfs');
      if (!e) throw new Error('Not found: ' + name + ' (create it first)');

      if (e.type === 'dir') {
        const newName = prompt('Rename folder "' + name + '" to:', name);
        if (newName === null) return;
        const trimmed = newName.trim();
        if (!trimmed || trimmed === name) return;
        const newT = Utils.resolvePath(this.cwd, trimmed);
        if (await Storage.get(newT, 'vfs')) throw new Error('Already exists: ' + trimmed);
        await Storage.set(newT, e, 'vfs');
        const all = await Storage.keys('vfs');
        for (const k of all) {
          if (k.startsWith(t + '/')) {
            const v = await Storage.get(k, 'vfs');
            await Storage.set(newT + k.slice(t.length), v, 'vfs');
            await Storage.remove(k, 'vfs');
          }
        }
        await Storage.remove(t, 'vfs');
        this.printSuccess('Renamed: ' + name + ' -> ' + trimmed);
        return;
      }

      await new Promise(resolve => {
        const ov = document.getElementById('editor');
        const ta = document.getElementById('editor-text');
        const nameInput = document.getElementById('editor-name');
        nameInput.value = name;
        ov.classList.remove('hidden');
        ta.value = e.content || '';
        ta.focus();
        const cl = document.getElementById('editor-close');
        const sv = document.getElementById('editor-save');
        const cleanup = () => {
          ov.classList.add('hidden');
          cl.onclick = null; sv.onclick = null;
          document.getElementById('capture').focus();
          resolve();
        };
        cl.onclick = () => cleanup();
        sv.onclick = async () => {
          const newName = nameInput.value.trim() || name;
          const newT = Utils.resolvePath(this.cwd, newName);
          if (newT !== t) {
            if (await Storage.get(newT, 'vfs')) {
              this.printError('Cannot rename: ' + newName + ' already exists.');
              return;
            }
            await Storage.remove(t, 'vfs');
          }
          await Storage.set(newT, { type: 'file', content: ta.value }, 'vfs');
          this.printSuccess('Saved: ' + newName);
          cleanup();
        };
      });
    })();
  },

  DATE() { this.printSystem(new Date().toLocaleDateString()); },
  TIME() { this.printSystem(new Date().toLocaleTimeString()); },
};

// ---------------- UI ----------------
const UI = {
  init() {
    this.cap = document.getElementById('capture');

    document.getElementById('workspace').addEventListener('click', () => {
      const sel = window.getSelection();
      if (sel && sel.toString().length) return;
      if (state.session && state.session.mode !== 'python_input' && !state.session.closed) this.cap.focus();
    });

    document.addEventListener('paste', (e) => {
      if (!document.getElementById('editor').classList.contains('hidden')) return;
      if (!document.getElementById('settings').classList.contains('hidden')) return;
      if (state.session && !this.cap.disabled) {
        this.cap.focus();
        const pastedText = (e.clipboardData || window.clipboardData).getData('text');
        if (pastedText) {
          this.cap.value += pastedText;
          state.session.updateLine();
          e.preventDefault();
        }
      }
    });

    this.cap.addEventListener('input', () => {
      if (state.session) state.session.updateLine();
    });

    this.cap.addEventListener('keydown', async e => {
      const s = state.session;
      if (!s || s.closed) return;
      if (e.key === 'Enter') {
        e.preventDefault();
        const v = this.cap.value;
        this.cap.value = '';
        s.updateLine();
        this.cap.disabled = true;
        try { await s.processInput(v); }
        finally {
          if (!s.closed && s.mode !== 'python_input') { this.cap.disabled = false; this.cap.focus(); }
        }
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (s.historyIndex > 0) {
          s.historyIndex--;
          this.cap.value = s.history[s.historyIndex];
          s.updateLine();
        }
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (s.historyIndex < s.history.length - 1) {
          s.historyIndex++;
          this.cap.value = s.history[s.historyIndex];
        } else {
          s.historyIndex = s.history.length;
          this.cap.value = '';
        }
        s.updateLine();
      }
    });

    window.addEventListener('keydown', e => {
      if (e.ctrlKey && e.key.toLowerCase() === 'l') {
        if (!state.session) return;
        if (!document.getElementById('editor').classList.contains('hidden')) return;
        if (!document.getElementById('settings').classList.contains('hidden')) return;
        e.preventDefault();
        state.session.clear();
        return;
      }
      if (!e.ctrlKey || e.key.toLowerCase() !== 'c') return;
      if (!state.session) return;
      if (!document.getElementById('editor').classList.contains('hidden')) return;
      if (!document.getElementById('settings').classList.contains('hidden')) return;
      if (window.getSelection && window.getSelection().toString()) return;
      const s = state.session;
      if (Terminal.commands['__PYTHON_ABORT__'] && (s.executing || s.mode.startsWith('python'))) {
        e.preventDefault();
        Terminal.commands['__PYTHON_ABORT__'].call(s);
        this.cap.value = '';
        this.cap.disabled = false;
        this.cap.focus();
        return;
      }
      if (s.executing || s.mode.startsWith('python')) return;
      e.preventDefault();
      s.print(s.promptEl.innerHTML + ' ' + Utils.escapeHTML(this.cap.value) + '^C', true);
      this.cap.value = '';
      s.updateLine();
    });

    const closeSettings = () => {
      document.getElementById('settings').classList.add('hidden');
      this.cap.focus();
    };
    document.getElementById('settings-x').onclick = closeSettings;
    document.getElementById('settings-cancel').onclick = closeSettings;
    document.getElementById('settings-save').onclick = async () => {
      const u = document.getElementById('s-user').value.trim() || 'user';
      const f = document.getElementById('s-font').value;
      const b = document.getElementById('s-bg').value;
      const oldUser = state.settings.username;
      state.settings = { username: u, fontColor: f, bgColor: b };
      try { localStorage.setItem('webterm_settings', JSON.stringify(state.settings)); } catch (e) {}
      if (u !== oldUser && state.session) {
        const oldHome = '/home/' + oldUser;
        const newHome = '/home/' + u;
        if (!(await Storage.get(newHome, 'vfs'))) await Storage.set(newHome, { type: 'dir' }, 'vfs');
        if (state.session.cwd === oldHome || state.session.cwd.startsWith(oldHome + '/')) state.session.cwd = newHome;
      }
      this.applySettings();
      closeSettings();
    };
  },

  openSettings() {
    document.getElementById('s-user').value = state.settings.username;
    document.getElementById('s-font').value = state.settings.fontColor;
    document.getElementById('s-bg').value = state.settings.bgColor;
    document.getElementById('settings').classList.remove('hidden');
  },

  applySettings() {
    const ws = document.getElementById('workspace');
    ws.style.background = state.settings.bgColor === 'bg-black' ? '#000' : '#fff';
    if (state.session) {
      state.session.container.className = 'term absolute inset-0 overflow-y-auto p-4 flex flex-col ' + state.settings.fontColor;
      state.session.updatePrompt();
    }
  },

  createSession() {
    state.session = new TerminalSession();
    Terminal.session = state.session;
    this.applySettings();
    this.cap.focus();
  },
};

// ---------------- Boot ----------------
function showBootError() {
  const overlay = document.getElementById('boot-error');
  if (overlay) overlay.classList.remove('hidden');
}

async function boot() {
  try {
    if (!window.URLS) throw new Error('url.js not loaded');
    await Storage.init();
    if (!(await Storage.get('/', 'vfs'))) await Storage.set('/', { type: 'dir' }, 'vfs');
    if (!(await Storage.get('/home', 'vfs'))) await Storage.set('/home', { type: 'dir' }, 'vfs');
    const home = '/home/' + state.settings.username;
    if (!(await Storage.get(home, 'vfs'))) await Storage.set(home, { type: 'dir' }, 'vfs');
    await ExtensionManager.loadAll();
    UI.init();
    UI.createSession();
  } catch (e) {
    showBootError();
  }
}
window.addEventListener('DOMContentLoaded', boot);
</script>
