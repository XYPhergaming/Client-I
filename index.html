<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Browser Terminal</title>
<style>
*,*::before,*::after{box-sizing:border-box;border-width:0;border-style:solid;border-color:#e5e7eb}
::selection{background:#2563eb;color:#fff}
html{line-height:1.5;-webkit-text-size-adjust:100%;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif}
body{margin:0;overflow:hidden;height:100vh;display:flex;flex-direction:column}
.flex{display:flex}.flex-col{flex-direction:column}.items-center{align-items:center}
.justify-between{justify-content:space-between}.justify-end{justify-content:flex-end}
.justify-center{justify-content:center}
.flex-1{flex:1 1 0%}.w-full{width:100%}.w-1\/2{width:50%}
.fixed{position:fixed}
.p-4{padding:1rem}.px-4{padding-left:1rem;padding-right:1rem}
.py-2{padding-top:.5rem;padding-bottom:.5rem}.px-3{padding-left:.75rem;padding-right:.75rem}
.px-6{padding-left:1.5rem;padding-right:1.5rem}
.py-1{padding-top:.25rem;padding-bottom:.25rem}.p-6{padding:1.5rem}
.mb-1{margin-bottom:.25rem}.mb-2{margin-bottom:.5rem}.mb-4{margin-bottom:1rem}.mb-6{margin-bottom:1.5rem}
.mt-4{margin-top:1rem}.mt-1{margin-top:.25rem}.mr-2{margin-right:.5rem}.gap-2{gap:.5rem}.gap-3{gap:.75rem}
.font-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
.font-sans{font-family:ui-sans-serif,system-ui,sans-serif}
.font-bold{font-weight:700}
.text-xs{font-size:.75rem;line-height:1rem}
.text-sm{font-size:.875rem;line-height:1.25rem}
.text-lg{font-size:1.125rem}.text-2xl{font-size:1.5rem}.text-3xl{font-size:1.875rem;line-height:2.25rem}
.tracking-widest{letter-spacing:.1em}
.max-w-lg{max-width:32rem}
.whitespace-pre{white-space:pre}.whitespace-pre-wrap{white-space:pre-wrap}.break-all{word-break:break-all}
.text-black{color:#000}.text-white{color:#fff}
.text-red-500{color:#ef4444}.text-red-600{color:#dc2626}
.text-blue-600{color:#2563eb}.text-green-600{color:#16a34a}
.text-yellow-600{color:#ca8a04}.text-gray-700{color:#374151}
.bg-white{background:#fff}.bg-black{background:#000}.bg-blue-600{background:#2563eb}
.bg-gray-50{background:#f9fafb}.bg-gray-200{background:#e5e7eb}.bg-gray-300{background:#d1d5db}
.border{border-width:1px;border-color:#d1d5db}.border-b{border-bottom-width:1px}
.border-red-500{border-color:#ef4444}
.rounded{border-radius:.25rem}.rounded-lg{border-radius:.5rem}.rounded-xl{border-radius:.75rem}
.shadow-2xl{box-shadow:0 25px 50px -12px rgba(0,0,0,.25)}
.hidden{display:none!important}.overflow-hidden{overflow:hidden}
.overflow-y-auto{overflow-y:auto}.absolute{position:absolute}
.inset-0{top:0;right:0;bottom:0;left:0}.z-50{z-index:50}
.outline-none{outline:2px solid transparent;outline-offset:2px}
.cursor-pointer{cursor:pointer}
.transition{transition-property:color,background-color,border-color,opacity,box-shadow,transform;transition-duration:.15s}
.hover\:bg-red-500:hover{background:#ef4444}
.hover\:text-black:hover{color:#000}
.term{
    scrollbar-width:thin;
    touch-action:manipulation;
    user-select:text;
    -webkit-user-select:text;
    padding-bottom:45vh !important;
    overflow-anchor: none;
}
.term::-webkit-scrollbar{width:8px}
.term::-webkit-scrollbar-thumb{background:rgba(128,128,128,.5);border-radius:4px}
.cursor-block{display:inline-block;width:.6em;height:1.2em;background:currentColor;vertical-align:middle;animation:blink 1.2s step-end infinite;pointer-events:none;user-select:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

#capture {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    opacity: 0;
    z-index: -1;
    pointer-events: none;
    font-size: 16px;
    resize: none;
}

#workspace{position:relative;flex:1;overflow:hidden}
#editor-text{flex:1;width:100%;padding:1rem;background:#fff;color:#1f2937;border:0;outline:0;font-family:ui-monospace,monospace;font-size:.875rem;resize:none}
#settings{background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:1rem}
.settings-card{background:#fff;border-radius:.75rem;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);width:100%;max-width:28rem;overflow:hidden;display:flex;flex-direction:column;max-height:90vh}
.settings-card label{display:block;font-size:.875rem;font-weight:600;color:#374151;margin-bottom:.5rem}
.settings-card input,.settings-card select{width:100%;padding:.5rem .75rem;border:1px solid #d1d5db;border-radius:.5rem;outline:0;color:#1f2937;background:#fff}
.settings-card input:focus,.settings-card select:focus{box-shadow:0 0 0 2px #2563eb;border-color:transparent}
#boot-error{background:#000}

/* ---- Mini / floating window ---- */
.mini-window{
  position:fixed;
  display:flex;
  flex-direction:column;
  background:#fff;
  color:#000;
  border:1px solid #d1d5db;
  border-radius:8px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
  overflow:hidden;
  z-index:100;
  min-width:180px;
  min-height:120px;
}
.mini-header{
  padding:4px 10px;
  background:#f3f4f6;
  border-bottom:1px solid #d1d5db;
  font-size:11px;
  font-weight:700;
  color:#374151;
  cursor:move;
  user-select:none;
  -webkit-user-select:none;
  flex-shrink:0;
  letter-spacing:.02em;
}
.mini-body{flex:1;position:relative;overflow:hidden}
.mini-term{
  position:absolute;
  top:0;left:0;right:0;bottom:0;
  overflow-y:auto;
  padding:6px;
  padding-bottom:6px !important;
  font-size:11px;
  line-height:1.35;
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  display:flex;
  flex-direction:column;
  color:#000;
  background:#fff;
  scrollbar-width:thin;
  overflow-anchor:none;
}
.mini-term::-webkit-scrollbar{width:6px}
.mini-term::-webkit-scrollbar-thumb{background:rgba(128,128,128,.5);border-radius:3px}
.mini-capture{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:1px;
  height:1px;
  opacity:0;
  z-index:1;
  pointer-events:none;
  font-size:16px;
  border:none;
  background:transparent;
  padding:0;
  margin:0;
  resize:none;
  outline:none;
}
</style>
</head>
<body class="font-mono text-sm">

<main id="workspace">
  <textarea id="capture" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go"></textarea>
</main>

<div id="boot-error" class="hidden fixed inset-0 flex flex-col items-center justify-center p-6" style="z-index:999">
  <h1 class="text-3xl font-bold text-red-500 tracking-widest mb-6">CONNECTION FAIL</h1>
  <button onclick="location.reload()" class="px-6 py-2 border border-red-500 text-red-500 rounded hover:bg-red-500 hover:text-black transition cursor-pointer">RETRY</button>
</div>

<div id="editor" class="hidden absolute inset-0 bg-white z-50 flex flex-col font-sans">
  <div class="bg-gray-50 px-4 py-2 border-b flex justify-between items-center">
    <input type="text" id="editor-name" class="text-blue-600 font-bold bg-transparent outline-none border-b border-blue-600 w-1/2" value="file">
    <div class="flex gap-2">
      <button id="editor-close" class="px-3 py-1 bg-white border rounded cursor-pointer">Close</button>
      <button id="editor-save" class="px-3 py-1 bg-blue-600 text-white rounded cursor-pointer">Save</button>
    </div>
  </div>
  <textarea id="editor-text" spellcheck="false"></textarea>
</div>

<div id="settings" class="hidden absolute inset-0 z-50 font-sans">
  <div class="settings-card">
    <div class="px-4 py-2 border-b flex justify-between items-center bg-gray-50">
      <h2 class="text-lg font-bold text-black">Terminal Settings</h2>
      <button id="settings-x" class="text-2xl font-bold text-black cursor-pointer">&times;</button>
    </div>
    <div class="p-4 flex-1 overflow-y-auto">
      <div class="mb-4"><label>User Name</label><input type="text" id="s-user" value="user"></div>
      <div class="mb-4"><label>Font Colour</label>
        <select id="s-font">
          <option value="text-black">Black</option>
          <option value="text-white">White</option>
          <option value="text-green-600">Green</option>
        </select>
      </div>
      <div class="mb-4"><label>Background</label>
        <select id="s-bg">
          <option value="bg-white">White</option>
          <option value="bg-black">Black</option>
        </select>
      </div>
    </div>
    <div class="px-4 py-2 border-b flex justify-end gap-2 bg-gray-50">
      <button id="settings-cancel" class="px-3 py-1 bg-white border rounded cursor-pointer">Cancel</button>
      <button id="settings-save" class="px-3 py-1 bg-blue-600 text-white rounded cursor-pointer">Save</button>
    </div>
  </div>
</div>

<script src="https://mrxclient-1.vercel.app/api/backend"></script>
<script>
'use strict';

const Storage = {
  db: null,
  init() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('WebTermDB', 200);
      r.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('vfs')) db.createObjectStore('vfs');
        if (!db.objectStoreNames.contains('system')) db.createObjectStore('system');
      };
      r.onsuccess = e => { this.db = e.target.result; res(); };
      r.onerror = e => rej(e.target.error);
    });
  },
  _t(s, m) { return this.db.transaction(s, m).objectStore(s); },
  get(k, s = 'vfs') { return new Promise((res, rej) => {
    const r = this._t(s, 'readonly').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  set(k, v, s = 'vfs') { return new Promise((res, rej) => {
    const r = this._t(s, 'readwrite').put(v, k); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); },
  remove(k, s = 'vfs') { return new Promise((res, rej) => {
    const r = this._t(s, 'readwrite').delete(k); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); },
  keys(s = 'vfs') { return new Promise((res, rej) => {
    const r = this._t(s, 'readonly').getAllKeys(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
};

const Utils = {
  escapeHTML(s) { return String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); },
  escapeRegex(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); },
  generateId() { return Math.random().toString(36).substring(2, 9); },
  resolvePath(cwd, p) {
    if (!p) return cwd;
    const parts = p.startsWith('/') ? p.split('/') : cwd.split('/').concat(p.split('/'));
    const r = [];
    for (const x of parts) {
      if (!x || x === '.') continue;
      if (x === '..') { if (r.length) r.pop(); } else r.push(x);
    }
    return '/' + r.join('/');
  },
  formatSize(b) {
    if (!b) return '0 B';
    const k = 1024, u = ['B','KB','MB','GB'];
    const i = Math.floor(Math.log(b) / Math.log(k));
    return (b / Math.pow(k, i)).toFixed(2) + ' ' + u[i];
  },
  truncate(s, n = 2000) { const x = String(s); return x.length > n ? x.slice(0, n) + '...' : x; },
};

function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem('webterm_settings') || '{}');
    return {
      username: (typeof s.username === 'string' && s.username.trim()) ? s.username : 'user',
      fontColor: ['text-black','text-white','text-green-600'].includes(s.fontColor) ? s.fontColor : 'text-black',
      bgColor: ['bg-white','bg-black'].includes(s.bgColor) ? s.bgColor : 'bg-white',
    };
  } catch (e) {
    return { username: 'user', fontColor: 'text-black', bgColor: 'bg-white' };
  }
}
const state = { session: null, settings: loadSettings() };

// ============ ALIASES (SESSION-ONLY) ============
let keyAliases = {};
let cmdAliases = {};
let extAliases = {};

function nameTaken(name) {
  const lower = name.toLowerCase();
  const reserved = ['asa','clear','in','inx','del','edit','run','go','cre','create','?','*','**','..go','@sys','@settings','@key','@pkg','@master_key'];
  if (reserved.includes(lower)) return true;
  for (const k of Object.keys(keyAliases)) if (k.toLowerCase() === lower) return true;
  for (const k of Object.keys(cmdAliases)) if (k.toLowerCase() === lower) return true;
  for (const k of Object.keys(extAliases)) if (k.toLowerCase() === lower) return true;
  for (const k of Object.keys(Terminal.extensions)) if (k.toLowerCase() === lower) return true;
  return false;
}

function isPackageEntryCommand(cmdName) {
  const ext = Terminal.extensions[String(cmdName).toLowerCase()];
  return !!(ext && ext.type === 'pkg');
}

function isValidCommandSource(src) {
  src = src.trim();
  if (!src) return false;
  if (src.includes('&')) {
    return src.split('&').every(p => isValidCommandSource(p.trim()));
  }
  const upper = src.toUpperCase();
  const simpleKeys = ['GO','..GO','CRE','CREATE','EDIT','CLEAR','ASA','?','*','**','@SYS','@SETTINGS','@KEY','IN','INX','@PKG','@MASTER_KEY'];
  if (simpleKeys.includes(upper)) return true;
  if (typeof CORE_HANDLERS !== 'undefined' && CORE_HANDLERS[upper]) return true;
  if (typeof Terminal !== 'undefined' && Terminal.commands && Terminal.commands[upper]) return true;
  if (/^in\(\s*\)$/i.test(src)) return true;
  if (/^in\{\s*.+\}$/i.test(src)) return true;
  if (/^inx\(\s*\)$/i.test(src)) return true;
  if (/^inx\{\s*.*\}$/i.test(src)) return true;
  if (/^inx\(\s*.+\s*\)$/i.test(src)) return true;
  if (/^inx\.[a-zA-Z0-9_]+$/i.test(src)) return true;
  if (/^del\(.+\)$/i.test(src)) return true;
  if (/^del\{.+\}$/i.test(src)) return true;
  if (/^run\{.+\}$/i.test(src)) return true;
  if (/^run\(.+\)$/i.test(src)) return true;
  if (/^run\s+[a-zA-Z0-9_]+$/i.test(src)) return true;
  const m = src.match(/^([a-zA-Z0-9_]+)\.([a-zA-Z][a-zA-Z0-9_]*)$/);
  if (m && Terminal.extensions[m[1].toLowerCase()]) return true;
  return false;
}

// ============ TERMINAL ============
const Terminal = {
  version: '1.0.0',
  commands: {},
  extensions: {},
  runners: {},
  modeHandlers: {},
  session: null,
  Storage, Utils,

  registerMode(name, handler) { this.modeHandlers[name] = handler; },
  unregisterMode(name) { delete this.modeHandlers[name]; },

  registerExtension(spec) {
    if (!spec || !spec.name) throw new Error('Extension must have a name');
    const name = spec.name.toLowerCase();
    if (this.extensions[name]) throw new Error('Extension already registered: ' + spec.name);
    spec.name = name;
    this.extensions[name] = spec;
    for (const [cmd, fn] of Object.entries(spec.commands || {})) {
      if (typeof fn !== 'function') continue;
      this.commands[cmd.toUpperCase()] = fn;
    }
    for (const [ext, fn] of Object.entries(spec.runners || {})) {
      if (typeof fn !== 'function') continue;
      this.runners[ext.toLowerCase()] = fn;
    }
    for (const [modeName, modeHandler] of Object.entries(spec.modes || {})) {
      this.registerMode(modeName, modeHandler);
    }
  },
  unregisterExtension(name) {
    const lower = name.toLowerCase();
    const spec = this.extensions[lower];
    if (!spec) return;
    for (const c of Object.keys(spec.commands || {})) delete this.commands[c.toUpperCase()];
    for (const e of Object.keys(spec.runners || {})) delete this.runners[e.toLowerCase()];
    for (const m of Object.keys(spec.modes || {})) this.unregisterMode(m);
    delete this.extensions[lower];
  },
  async sha256(text) {
    const buf = new TextEncoder().encode(text);
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
  },
  print(t)       { if (this.session) this.session.print(t); },
  printSystem(t) { if (this.session) this.session.printSystem(t); },
  printError(t)  { if (this.session) this.session.printError(t); },
  printSuccess(t){ if (this.session) this.session.printSuccess(t); },
  get cwd()      { return this.session ? this.session.cwd : '/home/user'; },
  getUsername()  { return state.settings.username; },
};
window.Terminal = Terminal;

// ============ EXTENSION MANAGER ============
const ExtensionManager = {
  get baseUrl() { return window.URLS.base; },
  resolveUrl(p) { return /^[a-z][a-z0-9+.-]*:/i.test(p) ? p : new URL(p, this.baseUrl).href; },

  async loadRegistry(url, refresh = false) {
    const absUrl = this.resolveUrl(url);
    const cacheKey = 'reg_' + absUrl.split('/').pop().split('?')[0];
    if (!refresh) {
      const cached = await Storage.get(cacheKey, 'system');
      if (cached) return cached;
    }
    const fetchUrl = absUrl + (absUrl.includes('?') ? '&' : '?') + 'v=' + Terminal.version;
    try {
      const r = await fetch(fetchUrl, { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const text = await r.text();
      if (/^\s*<!doctype/i.test(text) || /^\s*<html/i.test(text)) throw new Error('File not found (404)');
      const data = JSON.parse(text);
      await Storage.set(cacheKey, data, 'system');
      return data;
    } catch (e) {
      const cached = await Storage.get(cacheKey, 'system');
      if (cached) return cached;
      throw new Error('Registry unavailable: ' + e.message);
    }
  },

  async installPkg(name, onProgress) {
    const reg = await this.loadRegistry(window.URLS.pkgRegistry, true);
    const entry = reg.extensions.find(x => x.name.toLowerCase() === name.toLowerCase());
    if (!entry) throw new Error('NOT EXIST: ' + name);
    if (Terminal.extensions[entry.name.toLowerCase()]) {
      return { name: entry.name, info: 'ALREADY EXIST: ' + entry.name };
    }
    const relPath = (window.URLS.pkg || {})[entry.name.toLowerCase()];
    if (!relPath) throw new Error('NOT EXIST: ' + entry.name);
    if (onProgress) onProgress('Downloading ' + entry.name + '...');
    const abs = this.resolveUrl(relPath);
    const r = await fetch(abs + (abs.includes('?') ? '&' : '?') + 'v=' + Terminal.version, { cache: 'no-store' });
    if (!r.ok) throw new Error('Download failed: HTTP ' + r.status);
    const code = await r.text();
    if (entry.sha256) {
      const h = await Terminal.sha256(code);
      if (h !== entry.sha256) throw new Error('Integrity check failed: ' + entry.name);
    }
    if (Terminal.extensions[entry.name.toLowerCase()]) Terminal.unregisterExtension(entry.name);
    new Function('Terminal', code)(Terminal);
    if (!Terminal.extensions[entry.name.toLowerCase()]) throw new Error('Extension failed to register: ' + entry.name);
    Terminal.extensions[entry.name.toLowerCase()].type = 'pkg';
    await Storage.set('ext:' + entry.name, code, 'system');
    await Storage.set('ext_type:' + entry.name, 'pkg', 'system');
    return { name: entry.name, info: (Terminal.extensions[entry.name.toLowerCase()].info) || 'Package installed.' };
  },

  async installMaster(name, onProgress) {
    const lower = name.toLowerCase();
    if (Terminal.extensions[lower]) return { name: name, info: 'ALREADY EXIST: ' + name };
    const reg = await this.loadRegistry(window.URLS.masterRegistry, true);
    const entry = reg.extensions.find(x => x.name.toLowerCase() === lower);
    if (!entry) throw new Error('NOT EXIST: ' + name);
    const relPath = (window.URLS.master || {})[entry.name.toLowerCase()];
    if (!relPath) throw new Error('NOT EXIST: ' + entry.name);
    if (onProgress) onProgress('Importing ' + entry.name + '...');
    const abs = this.resolveUrl(relPath);
    const r = await fetch(abs + (abs.includes('?') ? '&' : '?') + 'v=' + Terminal.version, { cache: 'no-store' });
    if (!r.ok) throw new Error('Import failed: HTTP ' + r.status);
    const code = await r.text();
    if (entry.sha256) {
      const h = await Terminal.sha256(code);
      if (h !== entry.sha256) throw new Error('Integrity check failed: ' + entry.name);
    }
    new Function('Terminal', code)(Terminal);
    if (!Terminal.extensions[lower]) throw new Error('Master key failed to register: ' + entry.name);
    Terminal.extensions[lower].type = 'master';
    return { name: entry.name, info: (Terminal.extensions[lower].info) || 'Master key imported.' };
  },

  async remove(name) {
    const lower = name.toLowerCase();
    if (Terminal.extensions[lower]) {
      Terminal.unregisterExtension(lower);
      await Storage.remove('ext:' + lower, 'system');
      await Storage.remove('ext_type:' + lower, 'system');
      for (const [alias, ext] of Object.entries(extAliases)) {
        if (ext === lower) delete extAliases[alias];
      }
    }
  },

  async loadAll() {
    const keys = await Storage.keys('system');
    for (const key of keys) {
      if (typeof key !== 'string' || !key.startsWith('ext:')) continue;
      const name = key.slice(4);
      const code = await Storage.get(key, 'system');
      const type = await Storage.get('ext_type:' + name, 'system');
      if (!code || type !== 'pkg') continue;
      try {
        new Function('Terminal', code)(Terminal);
        if (Terminal.extensions[name.toLowerCase()]) Terminal.extensions[name.toLowerCase()].type = type;
      } catch (e) { console.warn('Failed to load ' + name + ': ' + e.message); }
    }
  },
};
window.ExtensionManager = ExtensionManager;

// ============ COMMAND LIST ============
const COMMAND_LIST = [
  ['in()', 'Import files from device'],
  ['in{pkg}', 'Install package'],
  ['in(pkg)', 'Install package'],
  ['in{url}', 'Download URL to VFS'],
  ['inx(file)', 'Export file to device'],
  ['inx(*)', 'Export all VFS to device'],
  ['inx{NAME}', 'Open mini screen for NAME'],
  ['inx{}', 'Open fallback fullscreen'],
  ['inx.NAME', 'Import master key'],
  ['inx.NAME asa ALIAS', 'Alias a master key'],
  ['run <master>', 'Show commands in master key'],
  ['del(file)', 'Delete file/folder'],
  ['del(*)', 'Delete all files'],
  ['del{pkg}', 'Delete package'],
  ['del{*}', 'Delete all packages'],
  ['edit name', 'Edit file or rename folder'],
  ['?', 'Show current location'],

// ============ SESSION ============
let _zCounter = 100;

class TerminalSession {
  constructor(opts = {}) {
    this.opts = opts;
    this.cwd = '/home/' + state.settings.username;
    this.history = [];
    this.historyIndex = -1;
    this.mode = 'shell';
    this.replBuffer = [];
    this.executing = false;
    this.promptPrefix = '';
    this.wrapper = null;

    this.out = document.createElement('div');
    this.out.className = 'flex flex-col whitespace-pre-wrap break-all';

    this.inputContainer = document.createElement('div');
    this.inputContainer.className = 'flex items-center mt-1';

    this.promptEl = document.createElement('span');
    this.promptEl.className = 'mr-2 font-bold whitespace-pre';
    this.lineEl = document.createElement('span');
    this.lineEl.className = 'whitespace-pre';
    this.cursor = document.createElement('span');
    this.cursor.className = 'cursor-block';

    this.inputContainer.append(this.promptEl, this.lineEl, this.cursor);

    if (opts.floating) {
      const w = this._createWindowWrapper(opts);
      this.wrapper = w.win;
      this.container = w.term;
      this.cap = w.cap;
      this.container.appendChild(this.out);
      this.container.appendChild(this.inputContainer);

      w.body.addEventListener('click', (e) => {
        const sel = window.getSelection();
        if (sel && sel.toString().length) return;
        this.cap.focus();
      });
    } else {
      this.cap = document.getElementById('capture');
      this.container = document.createElement('div');
      this.container.className = 'term absolute inset-0 overflow-y-auto p-4 flex flex-col ' + state.settings.fontColor;
      this.container.appendChild(this.out);
      this.container.appendChild(this.inputContainer);
      document.getElementById('workspace').appendChild(this.container);
    }

    this._updateFrame = null;
    this.updatePrompt();
  }

  _createWindowWrapper(opts) {
    const win = document.createElement('div');
    win.className = 'mini-window';
    win.style.zIndex = ++_zCounter;

    if (opts.fullscreen) {
      win.style.left = '0px';
      win.style.top = '0px';
      win.style.width = '100vw';
      win.style.height = '100vh';
      win.style.borderRadius = '0';
    } else {
      const count = Object.keys(UI.miniWindows).length + (UI.fallbackWindow ? 1 : 0);
      win.style.left = (50 + count * 30) + 'px';
      win.style.top = (80 + count * 30) + 'px';
      win.style.width = '340px';
      win.style.height = '260px';
    }

    const header = document.createElement('div');
    header.className = 'mini-header';
    header.textContent = opts.title || opts.scopeName || 'terminal';

    const body = document.createElement('div');
    body.className = 'mini-body';

    const term = document.createElement('div');
    term.className = 'mini-term';

    const cap = document.createElement('textarea');
    cap.className = 'mini-capture';
    cap.autocomplete = 'off';
    cap.autocorrect = 'off';
    cap.autocapitalize = 'off';
    cap.spellcheck = false;
    cap.setAttribute('enterkeyhint', 'go');

    body.appendChild(term);
    body.appendChild(cap);
    win.appendChild(header);
    win.appendChild(body);
    document.body.appendChild(win);

    this._bindDrag(win, header);

    const toFront = () => { win.style.zIndex = ++_zCounter; };
    win.addEventListener('mousedown', toFront);
    win.addEventListener('touchstart', toFront, { passive: true });

    return { win, term, cap, header, body };
  }

  _bindDrag(win, handle) {
    const startDrag = (e) => {
      if (e.target !== handle) return;
      const p = e.touches ? e.touches[0] : e;
      const sx = p.clientX, sy = p.clientY;
      const rect = win.getBoundingClientRect();
      const ox = rect.left, oy = rect.top;

      const move = (ev) => {
        const pt = ev.touches ? ev.touches[0] : ev;
        win.style.left = (ox + pt.clientX - sx) + 'px';
        win.style.top = (oy + pt.clientY - sy) + 'px';
      };
      const end = () => {
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', end);
        document.removeEventListener('touchmove', move);
        document.removeEventListener('touchend', end);
      };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', end);
      document.addEventListener('touchmove', move, { passive: false });
      document.addEventListener('touchend', end);
      e.preventDefault();
    };
    handle.addEventListener('mousedown', startDrag);
    handle.addEventListener('touchstart', startDrag, { passive: false });
  }

  closeWindow() {
    if (!this.wrapper) return;
    this.wrapper.remove();
    if (this.opts.scopeName && UI.miniWindows[this.opts.scopeName] === this) {
      delete UI.miniWindows[this.opts.scopeName];
    }
    if (UI.fallbackWindow === this) {
      UI.fallbackWindow = null;
    }
    if (UI.activeSession === this) {
      UI.activeSession = state.session;
      if (state.session && state.session.cap) state.session.cap.focus();
    }
  }

  updatePrompt() {
    if (this.mode !== 'shell') {
      this.promptEl.innerHTML = '<span>' + Utils.escapeHTML(this.promptPrefix || '') + '</span>';
      return;
    }
    let displayPath = state.settings.username;
    const home = '/home/' + state.settings.username;
    if (this.cwd === '/') displayPath = '/';
    else if (this.cwd !== home) {
      if (this.cwd.startsWith(home + '/')) displayPath += '/' + this.cwd.slice(home.length + 1);
      else displayPath = this.cwd;
    }
    this.promptEl.innerHTML = `<span class="font-bold">${Utils.escapeHTML(displayPath)}:</span>`;
  }

  updateLine() {
    if (this._updateFrame) return;
    this._updateFrame = requestAnimationFrame(() => {
      this.lineEl.textContent = this.cap.value;
      this._updateFrame = null;
    });
  }

  print(html, isHtml = false) {
    const isAtBottom = this.container.scrollHeight - this.container.scrollTop - this.container.clientHeight < 60;
    const d = document.createElement('div');
    d.className = 'mb-1';
    if (isHtml) d.innerHTML = html; else d.textContent = html;
    this.out.appendChild(d);
    if (isAtBottom) this.container.scrollTop = this.container.scrollHeight;
  }
  printSystem(t) { this.print('<span class="text-blue-600">' + Utils.escapeHTML(t) + '</span>', true); }
  printError(t)  { this.print('<span class="text-red-600">' + Utils.escapeHTML(String(t)) + '</span>', true); }
  printSuccess(t){ this.print('<span class="text-yellow-600">' + Utils.escapeHTML(t) + '</span>', true); }
  clear() { this.out.innerHTML = ''; }

  async processInput(input) {
    if (this.mode !== 'shell') {
      const handler = Terminal.modeHandlers[this.mode];
      if (handler && handler.onInput) return handler.onInput(this, input);
      this.mode = 'shell';
      this.promptPrefix = '';
      this.updatePrompt();
      return;
    }
    const trimmed = input.trim();
    if (!trimmed) return;

    this.print(this.promptEl.innerHTML + ' ' + Utils.escapeHTML(input), true);
    this.history.push(input);
    this.historyIndex = this.history.length;

    if (this.opts && (this.opts.scope === 'master' || this.opts.scope === 'pkg')) {
      await this.executeScoped(trimmed);
      return;
    }

    if (this.tryDefineAlias(trimmed)) return;

    if (trimmed.includes('&')) {
      for (const p of trimmed.split('&')) {
        if (p.trim()) {
          const success = await this.executeKey(p.trim());
          if (!success) break;
        }
      }
      return;
    }
    await this.executeKey(trimmed);
  }

  tryDefineAlias(input) {
    let m = input.match(/^inx\.([a-zA-Z0-9_]+)\s+asa\s+(.+)$/i);
    if (m) {
      const extName = m[1];
      const alias = m[2].trim();
      if (!/^[a-zA-Z0-9]+$/.test(alias)) { this.printError('INVALID KEY: ' + alias); return true; }
      this.defineExtAlias(extName, alias);
      return true;
    }
    m = input.match(/^\[(.+?)\]\s+asa\s+(.+)$/i);
    if (m) {
      const source = m[1].trim();
      const alias = m[2].trim();
      if (!alias.endsWith('...')) { this.printError('INVALID KEY: ' + alias); return true; }
      if (!isValidCommandSource(source)) { this.printError('INVALID KEY: ' + source); return true; }
      this.defineCmdAlias(source, alias);
      return true;
    }
    m = input.match(/^(.+?)\s+asa\s+(.+)$/i);
    if (m) {
      const source = m[1].trim();
      const alias = m[2].trim();
      if (!alias.endsWith('...')) { this.printError('INVALID KEY: ' + alias); return true; }
      if (!isValidCommandSource(source)) { this.printError('INVALID KEY: ' + source); return true; }
      const isCmd = /[(){}]/.test(source) || /\s/.test(source) || source.includes('&');
      if (isCmd) this.defineCmdAlias(source, alias);
      else this.defineKeyAlias(source, alias);
      return true;
    }
    return false;
  }

  defineKeyAlias(source, alias) {
    if (nameTaken(alias)) { this.printError('THIS KEY IS ALREADY EXIST: ' + alias); return; }
    keyAliases[alias] = source;
    this.printSuccess('ASA KEY CREATE: ' + alias);
  }
  defineCmdAlias(source, alias) {
    if (nameTaken(alias)) { this.printError('THIS KEY IS ALREADY EXIST: ' + alias); return; }
    cmdAliases[alias] = source;
    this.printSuccess('ASA KEY CREATE: ' + alias);
  }
  defineExtAlias(extName, alias) {
    if (nameTaken(alias)) { this.printError('THIS KEY IS ALREADY EXIST: ' + alias); return; }
    extAliases[alias] = extName.toLowerCase();
    this.printSuccess('ASA KEY CREATE: ' + alias);
  }

  resolveAlias(input) {
    const lower = input.toLowerCase();
    for (const [alias, cmd] of Object.entries(cmdAliases)) {
      const la = alias.toLowerCase();
      if (lower === la) return cmd;
      if (lower.startsWith(la + ' ')) return cmd + input.slice(alias.length);
    }
    const extList = Object.entries(extAliases).sort((a, b) => b[0].length - a[0].length);
    for (const [alias, ext] of extList) {
      const la = alias.toLowerCase();
      if (lower.startsWith(la + '.')) return ext + input.slice(alias.length);
    }
    const m = input.match(/^(\S+)([\s\S]*)$/);
    if (m) {
      const first = m[1].toLowerCase();
      for (const [alias, src] of Object.entries(keyAliases)) {
        if (alias.toLowerCase() === first) return src + m[2];
      }
    }
    return input;
  }

  // ============ SCOPED (mini window) EXECUTION ============
  async executeScoped(input) {
    const scopeName = this.opts.scopeName;
    if (!scopeName) { this.printError('INVALID SCOPE'); return; }

    // Exit command: <scopeName>.exit
    const exitRe = new RegExp('^' + Utils.escapeRegex(scopeName) + '\\.exit$', 'i');
    if (exitRe.test(input)) {
      this.closeWindow();
      return;
    }

    // run <masterkey> works in scope too
    const runMatch = input.match(/^RUN\s+([A-Za-z0-9_]+)$/i);
    if (runMatch) {
      try { await this.cmdRunMasterList(runMatch[1]); }
      catch (e) { this.printError(String(e.message || e).toUpperCase()); }
      return;
    }

    // Parse "cmd arg" or "cmd{...}" or "cmd"
    const m = input.match(/^([A-Za-z0-9_]+)(\{[\s\S]*\}|\s[\s\S]*)?$/);
    if (!m) { this.printError('INVALID KEY: ' + input); return; }

    const cmdName = m[1].toUpperCase();
    const arg = (m[2] || '').trim();

    const ext = Terminal.extensions[scopeName];
    if (!ext) { this.printError('SCOPE LOST: ' + scopeName); return; }

    const fn = ext.commands && ext.commands[cmdName];
    if (typeof fn !== 'function') {
      this.printError('INVALID KEY: ' + input);
      return;
    }

    try { await fn.call(this, arg); }
    catch (e) { this.printError(String(e.message || e).toUpperCase()); }
  }

  async executeKey(input) {
    input = input.trim();
    if (!input) return true;

    // Fallback window: close via <username>.exit
    if (this.opts && this.opts.scope === 'root') {
      const exitRe = new RegExp('^' + Utils.escapeRegex(state.settings.username) + '\\.exit$', 'i');
      if (exitRe.test(input)) {
        this.closeWindow();
        return true;
      }
    }

    input = this.resolveAlias(input);
    const upper = input.toUpperCase();

    if (isPackageEntryCommand(upper)) {
      this.printError('INVALID KEY: ' + input);
      return false;
    }

    // run <masterkey>
    let m = input.match(/^RUN\s+([A-Za-z0-9_]+)$/i);
    if (m) {
      try { await this.cmdRunMasterList(m[1]); return true; }
      catch (e) { this.printError(String(e.message || e).toUpperCase()); return false; }
    }

    m = input.match(/^inx\.([a-zA-Z0-9_]+)$/i);
    if (m) {
      try { await this.importMaster(m[1]); return true; }
      catch (e) { this.printError(String(e.message || e).toUpperCase()); return false; }
    }

    m = input.match(/^([a-zA-Z0-9_]+)\.([a-zA-Z][a-zA-Z0-9_]*)([\s\S]*)$/);
    if (m) {
      const ext = Terminal.extensions[m[1].toLowerCase()];
      const cmd = m[2].toUpperCase();
      const arg = m[3].trim();
      if (ext && ext.commands && ext.commands[cmd]) {
        try { await ext.commands[cmd].call(this, arg); return true; }
        catch (e) { this.printError(String(e.message || e).toUpperCase()); return false; }
      }
      this.printError('INVALID KEY: ' + input);
      return false;
    }

    // in() → file picker
    if (/^in\(\s*\)$/i.test(input) || input.toLowerCase() === 'in') {
      try { await this.cmdInImport(); return true; }
      catch (e) { this.printError(String(e.message || e).toUpperCase()); return false; }
    }
    // in(name) → package install (alias for in{name})
    m = input.match(/^in\(\s*([\s\S]+?)\s*\)$/i);
    if (m) {
      try { await this.cmdIn(m[1].trim()); return true; }
      catch (e) { this.printError(String(e.message || e).toUpperCase()); return false; }
    }
    // in{pkg|url}
    m = input.match(/^in\{\s*([\s\S]+?)\s*\}$/i);
    if (m) {
      try { await this.cmdIn(m[1].trim()); return true; }
      catch (e) { this.printError(String(e.message || e).toUpperCase()); return false; }
    }

    // inx() → legacy export all (still works)
    if (/^inx\(\s*\)$/i.test(input) || input.toLowerCase() === 'inx') {
      try { await this.cmdInxExportAll(); return true; }
      catch (e) { this.printError(String(e.message || e).toUpperCase()); return false; }
    }
    // inx(file) / inx(*) → export
    m = input.match(/^inx\(\s*([\s\S]+?)\s*\)$/i);
    if (m) {
      const a = m[1].trim();
      try {
        if (a === '*') await this.cmdInxExportAll();
        else await this.cmdInxExportFile(a);
        return true;
      } catch (e) { this.printError(String(e.message || e).toUpperCase()); return false; }
    }
    // inx{} / inx{name} → open mini / fallback window
    m = input.match(/^inx\{\s*([\s\S]*?)\s*\}$/i);
    if (m) {
      const name = m[1].trim();
      try {
        if (!name) await this.openFallbackWindow();
        else await this.openMiniWindow(name);
        return true;
      } catch (e) { this.printError(String(e.message || e).toUpperCase()); return false; }
    }

    // del(file) / del(*)
    m = input.match(/^del\(\s*([\s\S]+?)\s*\)$/i);
    if (m) {
      try {
        if (m[1].trim() === '*') await this.cmdDelAllFiles();
        else await this.cmdDelFile(m[1].trim());
        return true;
      } catch (e) { this.printError(String(e.message || e).toUpperCase()); return false; }
    }
    // del{pkg} / del{*}
    m = input.match(/^del\{\s*([\s\S]+?)\s*\}$/i);
    if (m) {
      try {
        if (m[1].trim() === '*') await this.cmdDelAllExts();
        else await this.cmdDelExt(m[1].trim());
        return true;
      } catch (e) { this.printError(String(e.message || e).toUpperCase()); return false; }
    }
    // RUN{pkg}
    m = input.match(/^RUN\{\s*([\s\S]+?)\s*\}$/i);
    if (m) {
      try { await this.cmdRunPkg(m[1].trim()); return true; }
      catch (e) { this.printError(String(e.message || e).toUpperCase()); return false; }
    }
    // RUN(file)
    m = input.match(/^RUN\(\s*([\s\S]+?)\s*\)$/i);
    if (m) {
      try { await this.cmdRunFile(m[1].trim()); return true; }
      catch (e) { this.printError(String(e.message || e).toUpperCase()); return false; }
    }

    const parts = input.split(/\s+/);
    const firstWord = parts[0];
    let cmdName;
    const braceWordMatch = firstWord.match(/^([A-Za-z0-9_]+)(\{[\s\S]*\})$/);
    if (braceWordMatch) {
      cmdName = braceWordMatch[1].toUpperCase() + braceWordMatch[2];
    } else {
      cmdName = firstWord.toUpperCase();
    }
    const arg = parts.slice(1).join(' ');

    if (CORE_HANDLERS[cmdName]) {
      try { await CORE_HANDLERS[cmdName].call(this, arg); return true; }
      catch (e) { this.printError(String(e.message || e).toUpperCase()); return false; }
    }
    if (Terminal.commands[cmdName]) {
      try { await Terminal.commands[cmdName].call(this, arg); return true; }
      catch (e) { this.printError(String(e.message || e).toUpperCase()); return false; }
    }
    this.printError('INVALID KEY: ' + input);
    return false;
  }

  // ============ COMMAND IMPLS ============
  async cmdInImport() {
    if (!window.showOpenFilePicker) throw new Error('File System Access API not supported');
    try {
      const files = await window.showOpenFilePicker({ multiple: true });
      for (const h of files) {
        const f = await h.getFile();
        const content = await f.text();
        await Storage.set(Utils.resolvePath(this.cwd, h.name), { type: 'file', content }, 'vfs');
        this.printSuccess('Imported: ' + h.name);
      }
    } catch (e) {
      if (e.name === 'AbortError') throw new Error('File selection aborted');
      throw e;
    }
  }

  async cmdIn(arg) {
    if (/^https?:\/\//i.test(arg)) {
      const id = Utils.generateId();
      this.print('<span id="' + id + '" class="text-blue-600">Downloading...</span>', true);
      try {
        const r = await fetch(arg);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const blob = await r.blob();
        const fn = (arg.split('/').pop() || 'file').split('?')[0] || 'downloaded_file';
        const vfsPath = Utils.resolvePath(this.cwd, fn);
        let content = '[Binary File: ' + blob.size + ' bytes]';
        const textLike = /^text\//.test(blob.type) || /(json|javascript|xml|svg|x-sh|yaml|csv|html)/i.test(blob.type);
        if (textLike || !blob.type) content = await blob.text();
        await Storage.set(vfsPath, { type: 'file', content }, 'vfs');
        const el = document.getElementById(id);
        if (el) { el.className = 'text-yellow-600'; el.textContent = 'Saved: ' + vfsPath; }
      } catch (e) {
        const el = document.getElementById(id);
        if (el) { el.className = 'text-red-600'; el.textContent = e.message; }
      }
      return;
    }
    const id = Utils.generateId();
    this.print('<span id="' + id + '" class="text-blue-600">Installing ' + Utils.escapeHTML(arg) + '...</span>', true);
    try {
      const res = await ExtensionManager.installPkg(arg, msg => {
        const el = document.getElementById(id); if (el) el.textContent = msg;
      });
      const el = document.getElementById(id);
      if (el) { el.className = 'text-yellow-600'; el.textContent = res.info; }
    } catch (e) {
      const el = document.getElementById(id);
      if (el) { el.className = 'text-red-600'; el.textContent = e.message; }
    }
  }

  async cmdInxExportAll() {
    const all = await Storage.keys('vfs');
    const data = {};
    for (const k of all) data[k] = await Storage.get(k, 'vfs');
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'vfs-backup-' + Date.now() + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    this.printSuccess('Exported all VFS files');
  }

  async cmdInxExportFile(name) {
    const target = Utils.resolvePath(this.cwd, name);
    const entry = await Storage.get(target, 'vfs');
    if (!entry || entry.type !== 'file') throw new Error('NOT EXIST: ' + name);
    const blob = new Blob([entry.content || ''], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name.split('/').pop();
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    this.printSuccess('Exported: ' + name);
  }

  async openMiniWindow(name) {
    const lower = name.toLowerCase();
    const ext = Terminal.extensions[lower];
    if (!ext) throw new Error('NOT EXIST: ' + name + ' (import with inx.' + lower + ')');

    if (UI.miniWindows[lower]) {
      UI.focusWindow(UI.miniWindows[lower]);
      return;
    }
    const type = ext.type === 'master' ? 'master' : 'pkg';
    const session = new TerminalSession({
      floating: true,
      scope: type,
      scopeName: lower,
      title: lower
    });
    UI.miniWindows[lower] = session;
    UI.attachInput(session);
    session.cap.focus();
    UI.activeSession = session;
  }

  async openFallbackWindow() {
    if (UI.fallbackWindow) {
      UI.focusWindow(UI.fallbackWindow);
      return;
    }
    const session = new TerminalSession({
      floating: true,
      fullscreen: true,
      scope: 'root',
      title: state.settings.username
    });
    UI.fallbackWindow = session;
    UI.attachInput(session);
    session.cap.focus();
    UI.activeSession = session;
  }

  async cmdDelFile(name) {
    const t = Utils.resolvePath(this.cwd, name);
    const prot = new Set(['/', '/home', '/home/' + state.settings.username]);
    if (prot.has(t)) throw new Error('Core folder is protected');
    const e = await Storage.get(t, 'vfs');
    if (!e) throw new Error('NOT EXIST: ' + name);
    if (e.type === 'dir') {
      const all = await Storage.keys('vfs');
      for (const k of all) if (k.startsWith(t + '/')) await Storage.remove(k, 'vfs');
    }
    await Storage.remove(t, 'vfs');
    this.printSuccess('Deleted: ' + name);
  }

  async cmdDelAllFiles() {
    const all = await Storage.keys('vfs');
    const prot = new Set(['/', '/home', '/home/' + state.settings.username]);
    let n = 0;
    for (const k of all) if (!prot.has(k)) { await Storage.remove(k, 'vfs'); n++; }
    this.printSuccess('Deleted ' + n + ' items');
  }

  async cmdDelExt(name) {
    const lower = name.toLowerCase();
    if (!Terminal.extensions[lower]) throw new Error('NOT EXIST: ' + name);
    await ExtensionManager.remove(lower);
    this.printSuccess('Removed: ' + name);
  }

  async cmdDelAllExts() {
    for (const extName of Object.keys(Terminal.extensions)) {
      Terminal.unregisterExtension(extName);
    }
    const keys = await Storage.keys('system');
    for (const k of keys) {
      if (typeof k === 'string' && k.startsWith('ext:')) {
        const n = k.slice(4);
        await Storage.remove(k, 'system');
        await Storage.remove('ext_type:' + n, 'system');
      }
    }
    extAliases = {};
    this.printSuccess('All extensions removed');
  }

  async importMaster(name) {
    const lower = name.toLowerCase();
    if (Terminal.extensions[lower]) { this.printError('THIS KEY IS ALREADY EXIST: ' + name); return; }
    const id = Utils.generateId();
    this.print('<span id="' + id + '" class="text-blue-600">Importing ' + Utils.escapeHTML(name) + '...</span>', true);
    try {
      const res = await ExtensionManager.installMaster(name, msg => {
        const el = document.getElementById(id); if (el) el.textContent = msg;
      });
      const el = document.getElementById(id);
      if (el) { el.className = 'text-yellow-600'; el.textContent = res.info; }
    } catch (e) {
      const el = document.getElementById(id);
      if (el) { el.className = 'text-red-600'; el.textContent = e.message; }
    }
  }

  async cmdRunMasterList(name) {
    const lower = name.toLowerCase();
    const ext = Terminal.extensions[lower];
    if (!ext) throw new Error('NOT EXIST: ' + name);
    if (ext.type !== 'master') throw new Error('NOT A MASTER KEY: ' + name);
    this.printSystem('Commands in ' + lower + ':');
    const cmds = Object.keys(ext.commands || {}).filter(c => !c.startsWith('__'));
    if (!cmds.length) this.printSystem('  (none)');
    else for (const c of cmds) this.printSystem('  ' + c);
  }

  async cmdRunPkg(pkg) {
    const lower = pkg.toLowerCase();
    const ext = Terminal.extensions[lower];
    if (!ext) { this.printError('NOT EXIST: ' + pkg); return; }

    let fn = ext.run;
    if (typeof fn !== 'function') fn = ext.commands && ext.commands[pkg.toUpperCase()];
    if (typeof fn !== 'function' && ext.commands) {
      for (const [k, v] of Object.entries(ext.commands)) {
        if (k.toLowerCase() === lower) { fn = v; break; }
      }
    }
    if (typeof fn !== 'function') { this.printError('INVALID KEY: ' + pkg); return; }

    let tick = 0;
    const seq = [3, 2, 1, 2];
    this.lineEl.textContent = '';
    this.cursor.style.display = 'none';
    const anim = setInterval(() => {
      if (this.mode !== 'shell' || !this.executing) return;
      const d = '.'.repeat(seq[tick % 4]);
      this.promptEl.innerHTML = `<span class="text-blue-600">${Utils.escapeHTML(pkg)}${d}</span>`;
      tick++;
    }, 200);

    this.executing = true;
    try { await fn.call(this); }
    catch (e) { this.printError(String(e.message || e).toUpperCase()); }
    finally {
      this.executing = false;
      clearInterval(anim);
      this.cursor.style.display = '';
      if (this.mode === 'shell') this.updatePrompt();
    }
  }

  async cmdRunFile(arg) {
    if (!arg) throw new Error('Usage: RUN(filename)');
    const fn = arg.split('/').pop();
    const dot = fn.lastIndexOf('.');
    const ext = dot > 0 ? '.' + fn.slice(dot + 1).toLowerCase() : '';
    const target = Utils.resolvePath(this.cwd, arg);
    const entry = await Storage.get(target, 'vfs');
    if (!entry || entry.type !== 'file') throw new Error('NOT EXIST: ' + arg);
    if (ext && Terminal.runners[ext]) return Terminal.runners[ext].call(this, fn, entry.content);
    this.print(entry.content);
  }
}

// ============ CORE HANDLERS ============
const CORE_HANDLERS = {
  '@SYS'() {
    const ua = navigator.userAgent;
    let os = 'UNKNOWN';
    if (/Windows/.test(ua)) os = 'WINDOWS';
    else if (/Mac OS|Macintosh/.test(ua)) os = 'MACOS';
    else if (/Android/.test(ua)) os = 'ANDROID';
    else if (/iPhone|iPad|iPod/.test(ua)) os = 'IOS';
    else if (/Linux/.test(ua)) os = 'LINUX';

    let browser = 'UNKNOWN';
    if (/Edg\//.test(ua)) browser = 'EDGE';
    else if (/OPR\/|Opera/.test(ua)) browser = 'OPERA';
    else if (/Chrome\//.test(ua)) browser = 'CHROME';
    else if (/Firefox\//.test(ua)) browser = 'FIREFOX';
    else if (/Safari\//.test(ua)) browser = 'SAFARI';

    const platform = navigator.platform || 'UNKNOWN';
    let netType = 'UNKNOWN';
    if (navigator.connection) {
      netType = navigator.connection.effectiveType || navigator.connection.type || 'UNKNOWN';
    }
    netType = netType.toLowerCase();

    const mem = performance.memory
      ? (performance.memory.usedJSHeapSize / 1048576).toFixed(2) + ' MB'
      : 'N/A';

    const up = Math.floor(performance.now() / 1000);
    const upStr = Math.floor(up / 60) + 'm ' + (up % 60) + 's';

    const now = new Date();
    const dd = String(now.getDate()).padStart(2, '0');
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const yyyy = now.getFullYear();
    const hours24 = now.getHours();
    const ampm = hours24 >= 12 ? 'PM' : 'AM';
    const h12 = hours24 % 12 || 12;
    const hh = String(h12).padStart(2, '0');
    const min = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    const dateTimeStr = `${dd}/${mm}/${yyyy} & ${hh}:${min}:${ss} ${ampm}`;

    this.print('');
    this.printSystem('KALMA ' + Terminal.version);
    this.printSystem('UPTIME: ' + upStr);
    this.printSystem('OS: ' + os);
    this.printSystem('NETWORK: ' + netType);
    this.printSystem('MEMORY: ' + mem);
    this.printSystem('SCREEN: ' + screen.width + 'x' + screen.height);
    this.printSystem('WINDOW: ' + window.innerWidth + 'x' + window.innerHeight);
    this.printSystem('BROWSER: ' + browser);
    this.printSystem('PLATFORM: ' + platform);
    this.printSystem('DATE & TIME: ' + dateTimeStr);
  },

  '@SETTINGS'() { UI.openSettings(); },

  '@KEY'() {
    for (const [usage, desc] of COMMAND_LIST) this.printSystem('  ' + usage.padEnd(28) + desc);
  },

  '@MASTER_KEY'() {
    return (async () => {
      try {
        this.printSystem('Fetching available master keys...');
        const reg = await ExtensionManager.loadRegistry(window.URLS.masterRegistry, true);
        this.printSystem('[Available Master Keys]');
        for (const e of reg.extensions) this.printSystem('  ' + e.name.padEnd(14) + ' v' + e.version + ' - ' + e.description);
      } catch(e) { this.printError('COULD NOT LOAD MASTER_KEY.JSON: ' + e.message); }
    })();
  },

  '@PKG'() {
    return (async () => {
      try {
        this.printSystem('Fetching available packages...');
        const reg = await ExtensionManager.loadRegistry(window.URLS.pkgRegistry, true);
        this.printSystem('[Available Packages]');
        for (const e of reg.extensions) this.printSystem('  ' + e.name.padEnd(14) + ' v' + e.version + ' - ' + e.description);
      } catch(e) { this.printError('COULD NOT LOAD PKG.JSON: ' + e.message); }
    })();
  },

  CLEAR() {
    this.clear();
    for (const n of Object.keys(Terminal.extensions)) {
      if (Terminal.extensions[n].type === 'master') Terminal.unregisterExtension(n);
    }
  },

  '?'() { this.printSystem(this.cwd); },

  '**'() {
    return (async () => {
      const all = await Storage.keys('vfs');
      const pfx = this.cwd === '/' ? '/' : this.cwd + '/';
      const firsts = new Set();
      for (const k of all) {
        if (k.startsWith(pfx) && k !== this.cwd) firsts.add(k.slice(pfx.length).split('/')[0]);
      }
      const items = [];
      for (const n of firsts) items.push([n, await Storage.get(pfx + n, 'vfs') || { type: 'file' }]);
      items.sort((a, b) => a[0].localeCompare(b[0]));
      if (!items.length) this.printSystem('  (empty)');
      else for (const [n, e] of items) {
        if (e.type === 'dir') this.printSystem('  ' + n + '/');
        else this.printSystem('  ' + n + '  (' + Utils.formatSize((e.content || '').length) + ')');
      }
    })();
  },

  '*'() {
    return (async () => {
      this.printSystem('[FILES]');
      const all = await Storage.keys('vfs');
      const pfx = this.cwd === '/' ? '/' : this.cwd + '/';
      const firsts = new Set();
      for (const k of all) {
        if (k.startsWith(pfx) && k !== this.cwd) firsts.add(k.slice(pfx.length).split('/')[0]);
      }
      const items = [];
      for (const n of firsts) items.push([n, await Storage.get(pfx + n, 'vfs') || { type: 'file' }]);
      items.sort((a, b) => a[0].localeCompare(b[0]));
      if (!items.length) this.printSystem('  (empty)');
      else for (const [n, e] of items) {
        if (e.type === 'dir') this.printSystem('  ' + n + '/');
        else this.printSystem('  ' + n + '  (' + Utils.formatSize((e.content || '').length) + ')');
      }
      this.printSystem('[EXTENSIONS]');
      const exts = Object.keys(Terminal.extensions);
      if (!exts.length) this.printSystem('  (none)');
      else for (const n of exts) this.printSystem('  ' + n);
    })();
  },

  'ASA'() {
    const kA = Object.keys(keyAliases);
    const cA = Object.keys(cmdAliases);
    const eA = Object.keys(extAliases);
    if (!kA.length && !cA.length && !eA.length) { this.printSystem('(no aliases)'); return; }
    if (kA.length) {
      this.printSystem('[KEY ALIASES]');
      for (const a of kA) this.printSystem('  ' + a + ' -> ' + keyAliases[a]);
    }
    if (cA.length) {
      this.printSystem('[COMMAND ALIASES]');
      for (const a of cA) this.printSystem('  ' + a + ' -> ' + cmdAliases[a]);
    }
    if (eA.length) {
      this.printSystem('[EXT ALIASES]');
      for (const a of eA) this.printSystem('  ' + a + ' -> ' + extAliases[a] + '.*');
    }
  },

  'GO'(arg) {
    const name = arg.trim();
    if (!name) throw new Error('Usage: go <folder>');
    return (async () => {
      const t = Utils.resolvePath(this.cwd, name);
      const e = await Storage.get(t, 'vfs');
      if (!e || e.type !== 'dir') throw new Error('NOT EXIST: ' + name);
      this.cwd = t;
      this.updatePrompt();
    })();
  },

  '..GO'() {
    this.cwd = Utils.resolvePath(this.cwd, '..');
    this.updatePrompt();
  },

  CRE(arg) {
    const name = arg.trim();
    if (!name) throw new Error('Usage: cre <filename>');
    return (async () => {
      const t = Utils.resolvePath(this.cwd, name);
      if (await Storage.get(t, 'vfs')) throw new Error('THIS KEY IS ALREADY EXIST: ' + name);
      await Storage.set(t, { type: 'file', content: '' }, 'vfs');
      this.printSuccess('File created: ' + name);
    })();
  },

  CREATE(arg) {
    const name = arg.trim();
    if (!name) throw new Error('Usage: create <folder>');
    return (async () => {
      const t = Utils.resolvePath(this.cwd, name);
      if (await Storage.get(t, 'vfs')) throw new Error('THIS KEY IS ALREADY EXIST: ' + name);
      await Storage.set(t, { type: 'dir' }, 'vfs');
      this.printSuccess('Folder created: ' + name);
    })();
  },

  EDIT(arg) {
    const name = arg.trim();
    if (!name) throw new Error('Usage: edit <name>');
    return (async () => {
      const t = Utils.resolvePath(this.cwd, name);
      const e = await Storage.get(t, 'vfs');
      if (!e) throw new Error('NOT EXIST: ' + name);
      if (e.type === 'dir') {
        const newName = prompt('Rename folder "' + name + '" to:', name);
        if (newName === null) return;
        const trimmed = newName.trim();
        if (!trimmed || trimmed === name) return;
        const newT = Utils.resolvePath(this.cwd, trimmed);
        if (await Storage.get(newT, 'vfs')) throw new Error('THIS KEY IS ALREADY EXIST: ' + trimmed);
        await Storage.set(newT, e, 'vfs');
        const all = await Storage.keys('vfs');
        for (const k of all) {
          if (k.startsWith(t + '/')) {
            const v = await Storage.get(k, 'vfs');
            await Storage.set(newT + k.slice(t.length), v, 'vfs');
            await Storage.remove(k, 'vfs');
          }
        }
        await Storage.remove(t, 'vfs');
        this.printSuccess('Renamed: ' + name + ' -> ' + trimmed);
        return;
      }
      await new Promise(resolve => {
        const ov = document.getElementById('editor');
        const ta = document.getElementById('editor-text');
        const nameInput = document.getElementById('editor-name');
        nameInput.value = name;
        ov.classList.remove('hidden');
        ta.value = e.content || '';
        ta.focus();
        const cl = document.getElementById('editor-close');
        const sv = document.getElementById('editor-save');
        const cleanup = () => {
          ov.classList.add('hidden');
          cl.onclick = null; sv.onclick = null;
          document.getElementById('capture').focus();
          resolve();
        };
        cl.onclick = () => cleanup();
        sv.onclick = async () => {
          const newName = nameInput.value.trim() || name;
          const newT = Utils.resolvePath(this.cwd, newName);
          if (newT !== t) {
            if (await Storage.get(newT, 'vfs')) {
              this.printError('THIS KEY IS ALREADY EXIST: ' + newName);
              return;
            }
            await Storage.remove(t, 'vfs');
          }
          await Storage.set(newT, { type: 'file', content: ta.value }, 'vfs');
          this.printSuccess('Saved: ' + newName);
          cleanup();
        };
      });
    })();
  },
};

// ============ UI ============
const UI = {
  miniWindows: {},
  fallbackWindow: null,
  activeSession: null,

  init() {
    document.getElementById('workspace').addEventListener('click', () => {
      const sel = window.getSelection();
      if (sel && sel.toString().length) return;
      if (state.session) state.session.cap.focus();
    });

    document.addEventListener('paste', (e) => {
      if (!document.getElementById('editor').classList.contains('hidden')) return;
      if (!document.getElementById('settings').classList.contains('hidden')) return;
      const s = UI.activeSession || state.session;
      if (!s) return;
      if (s.cap.disabled) return;
      s.cap.focus();
      const txt = (e.clipboardData || window.clipboardData).getData('text');
      if (txt) {
        s.cap.value += txt;
        s.updateLine();
        e.preventDefault();
      }
    });

    window.addEventListener('keydown', e => {
      if (e.ctrlKey && e.key.toLowerCase() === 'l') {
        const s = UI.activeSession || state.session;
        if (!s) return;
        if (!document.getElementById('editor').classList.contains('hidden')) return;
        if (!document.getElementById('settings').classList.contains('hidden')) return;
        e.preventDefault();
        s.clear();
        return;
      }
      if (!e.ctrlKey || e.key.toLowerCase() !== 'c') return;
      const s = UI.activeSession || state.session;
      if (!s) return;
      if (!document.getElementById('editor').classList.contains('hidden')) return;
      if (!document.getElementById('settings').classList.contains('hidden')) return;
      if (window.getSelection && window.getSelection().toString()) return;

      if (s.mode !== 'shell') {
        const handler = Terminal.modeHandlers[s.mode];
        if (handler && handler.onAbort) {
          e.preventDefault();
          handler.onAbort(s);
          s.cap.value = '';
        }
        return;
      }
      if (s.executing) return;
      e.preventDefault();
      s.print(s.promptEl.innerHTML + ' ' + Utils.escapeHTML(s.cap.value) + '^C', true);
      s.cap.value = '';
      s.updateLine();
    });

    const closeSettings = () => {
      document.getElementById('settings').classList.add('hidden');
      if (UI.activeSession) UI.activeSession.cap.focus();
    };
    document.getElementById('settings-x').onclick = closeSettings;
    document.getElementById('settings-cancel').onclick = closeSettings;
    document.getElementById('settings-save').onclick = async () => {
      const u = document.getElementById('s-user').value.trim() || 'user';
      const f = document.getElementById('s-font').value;
      const b = document.getElementById('s-bg').value;
      const oldUser = state.settings.username;
      state.settings = { username: u, fontColor: f, bgColor: b };
      try { localStorage.setItem('webterm_settings', JSON.stringify(state.settings)); } catch (e) {}
      if (u !== oldUser && state.session) {
        const oldHome = '/home/' + oldUser, newHome = '/home/' + u;
        if (!(await Storage.get(newHome, 'vfs'))) await Storage.set(newHome, { type: 'dir' }, 'vfs');
        if (state.session.cwd === oldHome || state.session.cwd.startsWith(oldHome + '/')) {
          state.session.cwd = newHome;
        }
      }
      this.applySettings();
      closeSettings();
    };
  },

  attachInput(session) {
    const cap = session.cap;

    cap.addEventListener('input', () => session.updateLine());
    cap.addEventListener('focus', () => { UI.activeSession = session; });

    cap.addEventListener('keydown', async e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (session.executing && !session._inputResolver) return;
        const v = cap.value;
        cap.value = '';
        session.updateLine();

        if (session._inputResolver) {
          try { await session.processInput(v); } catch (err) {}
          return;
        }

        session.executing = true;
        try { await session.processInput(v); }
        catch (err) {}
        finally { session.executing = false; }
        return;
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (session.historyIndex > 0) {
          session.historyIndex--;
          cap.value = session.history[session.historyIndex];
          session.updateLine();
        }
        return;
      }
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (session.historyIndex < session.history.length - 1) {
          session.historyIndex++;
          cap.value = session.history[session.historyIndex];
        } else {
          session.historyIndex = session.history.length;
          cap.value = '';
        }
        session.updateLine();
        return;
      }
    });
  },

  focusWindow(session) {
    if (!session) return;
    session.cap.focus();
    UI.activeSession = session;
  },

  openSettings() {
    document.getElementById('s-user').value = state.settings.username;
    document.getElementById('s-font').value = state.settings.fontColor;
    document.getElementById('s-bg').value = state.settings.bgColor;
    document.getElementById('settings').classList.remove('hidden');
  },

  applySettings() {
    document.getElementById('workspace').style.background =
      state.settings.bgColor === 'bg-black' ? '#000' : '#fff';
    if (state.session) {
      state.session.container.className = 'term absolute inset-0 overflow-y-auto p-4 flex flex-col ' + state.settings.fontColor;
      state.session.updatePrompt();
    }
  },

  createSession() {
    state.session = new TerminalSession();
    Terminal.session = state.session;
    UI.activeSession = state.session;
    this.applySettings();
    UI.attachInput(state.session);
    state.session.cap.focus();
  },
};

async function boot() {
  try {
    if (!window.URLS) throw new Error('backend.js config not loaded');
    await Storage.init();
    if (!(await Storage.get('/', 'vfs'))) await Storage.set('/', { type: 'dir' }, 'vfs');
    if (!(await Storage.get('/home', 'vfs'))) await Storage.set('/home', { type: 'dir' }, 'vfs');
    const home = '/home/' + state.settings.username;
    if (!(await Storage.get(home, 'vfs'))) await Storage.set(home, { type: 'dir' }, 'vfs');

    await ExtensionManager.loadAll();
    UI.init();
    UI.createSession();
  } catch (e) {
    const el = document.getElementById('boot-error');
    if (el) el.classList.remove('hidden');
  }
}
window.addEventListener('DOMContentLoaded', boot);
