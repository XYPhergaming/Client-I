<script>

const FONT_FAMILIES = {
  mono:"ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono','Courier New',monospace",
  courier:"'Courier New',Courier,monospace",
  consolas:"Consolas,Monaco,'Courier New',monospace",
  monaco:"Monaco,Consolas,'Courier New',monospace",
  menlo:"Menlo,Monaco,Consolas,'Courier New',monospace",
  lucida:"'Lucida Console',Monaco,monospace",
  source:"'Source Code Pro',ui-monospace,monospace",
  fira:"'Fira Code',ui-monospace,monospace",
  jetbrains:"'JetBrains Mono',ui-monospace,monospace",

  ubuntu:"'Ubuntu Mono',ui-monospace,monospace",

};
const FONT_LABELS = {
  mono:'Monospace (default)', courier:'Courier New', consolas:'Consolas', monaco:'Monaco', menlo:'Menlo',
  lucida:'Lucida Console', source:'Source Code Pro', fira:'Fira Code', jetbrains:'JetBrains Mono',
  roboto:'Roboto Mono', ibmplex:'IBM Plex Mono', space:'Space Mono', inconsolata:'Inconsolata',
  vt323:'VT323 (terminal)', sharetech:'Share Tech Mono', ubuntu:'Ubuntu Mono', anonymous:'Anonymous Pro'
};

const EXECUTABLE_EXT = /\.(exe|dll|so|dylib|com|scr|msi|apk|ipa|bin|dat|jar|war|appimage|dmg|pkg|deb|rpm|app|cmd)$/i;
const NATIVE_SCRIPT_EXT = /\.(sh|bash|zsh|fish|bat|ps1|psm1|vbs|vbe|wsf|wsh|hta|jse)$/i;
const ACTIVE_HTML_EXT = /\.(html?|htm|svg|xhtml|xht|xml|xsl|xslt|rss|atom)$/i;

const SecurityScanner = {
  scan(filename, content) {
    const name = String(filename || '').toLowerCase();
    const s = String(content == null ? '' : content);
    if (EXECUTABLE_EXT.test(name)) return { safe: false, reason: 'EXECUTABLE/BINARY FILE TYPE BLOCKED' };
    if (NATIVE_SCRIPT_EXT.test(name) && s.trim().length > 0) return { safe: false, reason: 'NATIVE SCRIPT FILE BLOCKED' };
    if (ACTIVE_HTML_EXT.test(name)) {
      if (/<script[\s>]/i.test(s)) return { safe: false, reason: 'INLINE <script> TAG' };
      if (/\son[a-z]+\s*=/i.test(s)) return { safe: false, reason: 'INLINE EVENT HANDLER' };
      if (/javascript\s*:/i.test(s)) return { safe: false, reason: 'JAVASCRIPT: URI' };
      if (/<iframe|<object|<embed|<frame|<frameset/i.test(s)) return { safe: false, reason: 'EMBEDDED FRAME/OBJECT' };
      if (/<meta[^>]*http-equiv\s*=\s*["']?refresh/i.test(s)) return { safe: false, reason: 'META REFRESH REDIRECT' };
      if (/data:text\/html;base64,/i.test(s)) return { safe: false, reason: 'DATA URI HTML PAYLOAD' };
    }
    if (s.indexOf('\0') !== -1) return { safe: false, reason: 'NULL BYTES DETECTED' };
    if (s.length > 2 * 1024 * 1024) return { safe: false, reason: 'FILE TOO LARGE (>2MB)' };
    if (/\.\.[\/\\]/.test(name) || /^[\/\\]/.test(name)) return { safe: false, reason: 'PATH TRAVERSAL IN FILENAME' };
    if (!name || name.length > 255) return { safe: false, reason: 'INVALID FILENAME' };
    const patterns = [
      /<svg[^>]*\sonload\s*=/i, /\bdocument\.cookie\s*=/i,
      /\bwindow\.location\s*=\s*['"]?javascript:/i,
      /require\s*\(\s*['"`]child_process['"`]\s*\)/i,
      /\bexec\s*\(\s*['"`](?:rm\s+-rf|del\s+\/[sq]|format\s+[a-z]:)/i,
      /\bpowershell(?:\.exe)?\s+-(?:e|enc|encodedcommand)\b/i,
      /\\\\[a-z]:\\[^\\]+\.(?:exe|dll|bat|cmd)/i,
      /\beval\s*\(\s*(?:atob\s*\(|unescape\s*\(|String\.fromCharCode)/i,
      /\.onreadystatechange\s*=\s*(?:document\.location|eval)/i
    ];
    for (const re of patterns) {
      if (re.test(s)) {
        if (!/\.(txt|md|log|json|yml|yaml|csv|py|sql)$/i.test(name)) {
          return { safe: false, reason: 'MALICIOUS PATTERN DETECTED' };
        }
      }
    }
    return { safe: true };
  }
};

function createCustomSelect(options, initialValue, onChange) {
  const wrap = document.createElement('div');
  wrap.style.position = 'relative';
  wrap.style.width = '100%';
  
  const trigger = document.createElement('div');
  Object.assign(trigger.style, { 
    padding: '6px 10px', 
    border: '1px solid #1e3a8a', 
    borderRadius: '4px', 
    background: '#02120a', 
    color: '#00d8ff', 
    cursor: 'pointer', 
    display: 'flex', 
    justifyContent: 'space-between', 
    alignItems: 'center', 
    fontSize: '12px',
    fontFamily: 'inherit',
    transition: 'all 0.2s'
  });
  
  trigger.onmouseenter = () => { trigger.style.boxShadow = '0 0 8px #2563eb'; trigger.style.borderColor = '#00d8ff'; };
  trigger.onmouseleave = () => { trigger.style.boxShadow = 'none'; trigger.style.borderColor = '#1e3a8a'; };

  const label = document.createElement('span');
  const currentOpt = options.find(o => o.value === initialValue) || options[0];
  label.textContent = currentOpt ? currentOpt.label : initialValue;
  label.style.fontFamily = currentOpt && currentOpt.fontFamily ? currentOpt.fontFamily : 'inherit';
  
  const arrow = document.createElement('span');
  arrow.innerHTML = '&#9662;';
  arrow.style.fontSize = '0.8em';
  trigger.appendChild(label); trigger.appendChild(arrow);

  let selectedValue = initialValue;
  
  trigger.onclick = (e) => {
    e.stopPropagation();
    
    const overlay = document.createElement('div');
    overlay.className = 'custom-select-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(2px);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn 0.2s ease-out;';
    
    const list = document.createElement('div');
    list.style.cssText = 'background:#031a0e;border:1px solid #2563eb;border-radius:6px;max-width:300px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 0 20px rgba(37,99,235,0.5);display:flex;flex-direction:column;animation:slideUp 0.2s ease-out;';
    
    const title = document.createElement('div');
    title.textContent = 'SELECT OPTION';
    title.style.cssText = 'padding:10px;text-align:center;color:#00d8ff;font-family:monospace;font-weight:bold;border-bottom:1px solid #1e3a8a;letter-spacing:1px;';
    list.appendChild(title);

    options.forEach(opt => {
      const item = document.createElement('div');
      item.style.cssText = 'padding:10px;cursor:pointer;color:#60a5fa;font-size:13px;border-bottom:1px solid #1e3a8a;transition:background 0.2s;font-family:monospace;';
      item.textContent = opt.label;
      item.onmouseenter = () => { item.style.background = '#042413'; item.style.color = '#00d8ff'; };
      item.onmouseleave = () => { item.style.background = 'transparent'; item.style.color = '#60a5fa'; };
      item.onclick = (ev) => {
        ev.stopPropagation();
        selectedValue = opt.value;
        label.textContent = opt.label;
        label.style.fontFamily = opt.fontFamily || 'inherit';
        if (onChange) onChange(selectedValue);
        overlay.remove();
      };
      list.appendChild(item);
    });

    overlay.appendChild(list);
    document.body.appendChild(overlay);
  };
  
  wrap.appendChild(trigger);
  return { wrap, getValue: () => selectedValue, setValue: (v) => {
    selectedValue = v;
    const o = options.find(x => x.value === v);
    if (o) { label.textContent = o.label; label.style.fontFamily = o.fontFamily || 'inherit'; }
  }};
}

const Storage = {
  db: null,
  init() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('WebTermDB', 200);
      r.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('vfs')) db.createObjectStore('vfs');
        if (!db.objectStoreNames.contains('system')) db.createObjectStore('system');
      };
      r.onsuccess = e => { this.db = e.target.result; res(); };
      r.onerror = e => rej(e.target.error);
    });
  },
  _t(s, m) { return this.db.transaction(s, m).objectStore(s); },
  get(k, s = 'vfs') { return new Promise((res, rej) => { const r = this._t(s, 'readonly').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  set(k, v, s = 'vfs') { return new Promise((res, rej) => { const r = this._t(s, 'readwrite').put(v, k); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); },
  remove(k, s = 'vfs') { return new Promise((res, rej) => { const r = this._t(s, 'readwrite').delete(k); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); },
  keys(s = 'vfs') { return new Promise((res, rej) => { const r = this._t(s, 'readonly').getAllKeys(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
};

const Utils = {
  escapeHTML(s) { return String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); },
  escapeRegex(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); },
  generateId() { return Math.random().toString(36).substring(2, 9); },
  resolvePath(cwd, p) {
    if (!p) return cwd;
    const parts = p.startsWith('/') ? p.split('/') : cwd.split('/').concat(p.split('/'));
    const r = [];
    for (const x of parts) { if (!x || x === '.') continue; if (x === '..') { if (r.length) r.pop(); } else r.push(x); }
    return '/' + r.join('/');
  },
  basename(p) {
    const s = String(p || '').replace(/^\/+|\/+$/g, '');
    if (!s) return '';
    const parts = s.split('/').filter(Boolean);
    return parts.length ? parts[parts.length - 1] : '';
  },
  formatSize(b) {
    if (!b) return '0 B';
    const k = 1024, u = ['B','KB','MB','GB'];
    const i = Math.floor(Math.log(b) / Math.log(k));
    return (b / Math.pow(k, i)).toFixed(2) + ' ' + u[i];
  },
  truncate(s, n = 2000) { const x = String(s); return x.length > n ? x.slice(0, n) + '...' : x; }
};

let keyAliases = {};
let cmdAliases = {};
let extAliases = {};

function nameTaken(name) {
  const lower = name.toLowerCase();
  const reserved = ['import','install','export','mini','del','edit','go','cre','create','?','*','**','..go','@sys','@key','@pkg','@master_key','clear','asa','run','runx'];
  if (reserved.includes(lower)) return true;
  for (const k of Object.keys(keyAliases)) if (k.toLowerCase() === lower) return true;
  for (const k of Object.keys(cmdAliases)) if (k.toLowerCase() === lower) return true;
  for (const k of Object.keys(extAliases)) if (k.toLowerCase() === lower) return true;
  for (const k of Object.keys(Terminal.extensions)) if (k.toLowerCase() === lower) return true;
  return false;
}

function isPackageEntryCommand(cmdName) {
  const base = String(cmdName).replace(/\{[\s\S]*\}$/, '').trim().toUpperCase();
  const ext = Terminal.extensions[base.toLowerCase()];
  return !!(ext && ext.type === 'pkg');
}

function splitTopLevelAmp(input) {
  const parts = [];
  let depth = 0, cur = '';
  for (const ch of String(input)) {
    if ('{(['.includes(ch)) depth++;
    else if ('})]'.includes(ch)) depth = Math.max(0, depth - 1);
    if (ch === '&' && depth === 0) { parts.push(cur); cur = ''; }
    else cur += ch;
  }
  if (cur.trim()) parts.push(cur);
  return parts;
}

function isValidCommandSource(src) {
  src = src.trim();
  if (!src) return false;
  if (src.includes('&')) return splitTopLevelAmp(src).every(p => isValidCommandSource(p.trim()));
  const parts = src.split(/\s+/);
  const firstWord = parts[0];
  let cmdName;
  const braceWordMatch = firstWord.match(/^([A-Za-z0-9_]+)(\{[\s\S]*\})$/);
  if (braceWordMatch) cmdName = braceWordMatch[1].toUpperCase() + braceWordMatch[2];
  else cmdName = firstWord.toUpperCase();
  const simpleKeys = ['GO','..GO','CRE','CREATE','EDIT','CLEAR','ASA','?','*','**','@SYS','@KEY','@PKG','@MASTER_KEY'];
  if (simpleKeys.includes(cmdName)) return true;
  if (typeof CORE_HANDLERS !== 'undefined' && CORE_HANDLERS[cmdName]) return true;
  if (typeof Terminal !== 'undefined' && Terminal.commands && Terminal.commands[cmdName]) return true;
  if (/^Import\(\s*\)$/i.test(src)) return true;
  if (/^Import\{\s*.+\}$/i.test(src)) return true;
  if (/^Install\{\s*.+\}$/i.test(src)) return true;
  if (/^Export\(\s*\)$/i.test(src)) return true;
  if (/^Export\(\s*.+\s*\)$/i.test(src)) return true;
  if (/^Mini\{\s*.*\}$/i.test(src)) return true;
  if (/^MINI\{\{\s*.+\s*\}\}$/i.test(src)) return true;
  if (/^del\(\s*.+\s*\)$/i.test(src)) return true;
  if (/^del\{\s*.+\}$/i.test(src)) return true;
  if (/^RUN\{\s*.+\}$/i.test(src)) return true;
  if (/^RUN\(\s*.+\s*\)$/i.test(src)) return true;
  if (/^run\s+[a-zA-Z0-9_]+$/i.test(src)) return true;
  const m = src.match(/^([a-zA-Z0-9_]+)\./);
  if (m && Terminal.extensions[m[1].toLowerCase()]) return true;
  return false;
}

function resolveExtensionCommand(ext, input) {
  input = String(input || '').trim();
  if (!input) return null;

  const direct = input.match(/^([a-zA-Z_][a-zA-Z0-9_]*)(?:\{([^{}]*)\})?(?:\s+([\s\S]*))?$/);
  if (direct) {
    const cmdName = direct[1].toUpperCase();
    let cmdArg = direct[2] !== undefined ? direct[2] : (direct[3] || '');
    cmdArg = cmdArg.trim();
    const wrapped = cmdArg.match(/^\{([\s\S]*)\}$/);
    if (wrapped) cmdArg = wrapped[1];
    if (ext.commands && typeof ext.commands[cmdName] === 'function') {
      return { handler: ext.commands[cmdName], arg: cmdArg };
    }
  }

  if (Array.isArray(ext.routes)) {
    for (const route of ext.routes) {
      const m = input.match(route.pattern);
      if (m) {
        const key = String(route.handler || '').toUpperCase();
        const handler = ext.commands && ext.commands[key];
        if (typeof handler === 'function') {
          const captures = m.slice(1);
          const arg = captures.length === 0 ? '' : (captures.length === 1 ? captures[0] : captures);
          return { handler, arg };
        }
      }
    }
  }
  return null;
}

const Terminal = {
  version: '2.3.0',
  commands: {},
  extensions: {},
  runners: {},
  modeHandlers: {},
  session: null,
  _sessionCleanupHooks: [],
  Storage, Utils, SecurityScanner,

  registerMode(name, handler) { this.modeHandlers[name] = handler; },
  unregisterMode(name) { delete this.modeHandlers[name]; },

  registerExtension(spec) {
    if (!spec || !spec.name) throw new Error('Extension must have a name');
    const name = spec.name.toLowerCase();
    if (this.extensions[name]) throw new Error('Extension already registered: ' + spec.name);
    spec.name = name;
    spec.commands = spec.commands || {};

    const scopedOnlyNames = new Set();
    if (spec.scopedOnly && typeof spec.scopedOnly === 'object') {
      for (const [k, fn] of Object.entries(spec.scopedOnly)) {
        if (typeof fn !== 'function') continue;
        spec.commands[k] = fn;
        scopedOnlyNames.add(k.toUpperCase());
      }
    }

    this.extensions[name] = spec;

    for (const [cmd, fn] of Object.entries(spec.commands)) {
      if (typeof fn !== 'function') continue;
      if (scopedOnlyNames.has(cmd.toUpperCase())) continue;
      this.commands[cmd.toUpperCase()] = fn;
    }

    for (const [ext, fn] of Object.entries(spec.runners || {})) {
      if (typeof fn !== 'function') continue;
      this.runners[ext.toLowerCase()] = fn;
    }
    for (const [modeName, modeHandler] of Object.entries(spec.modes || {})) {
      this.registerMode(modeName, modeHandler);
    }
  },

  unregisterExtension(name) {
    const lower = name.toLowerCase();
    const spec = this.extensions[lower];
    if (!spec) return;
    for (const c of Object.keys(spec.commands || {})) delete this.commands[c.toUpperCase()];
    for (const e of Object.keys(spec.runners || {})) delete this.runners[e.toLowerCase()];
    for (const m of Object.keys(spec.modes || {})) this.unregisterMode(m);
    delete this.extensions[lower];
  },

  async sha256(text) {
    const buf = new TextEncoder().encode(text);
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
  },

  print(t)       { if (this.session) this.session.print(t); },
  printSystem(t) { if (this.session) this.session.printSystem(t); },
  printError(t)  { if (this.session) this.session.printError(t); },
  printSuccess(t){ if (this.session) this.session.printSuccess(t); },
  get cwd()      { return this.session ? this.session.cwd : '/home/user'; },
  getUsername()  { return state.settings.username; }
};
window.Terminal = Terminal;

const ExtensionManager = {
  get baseUrl() { return state.settings.apiBase || window.URLS.base; },
  resolveUrl(p) {
    if (/^[a-z][a-z0-9+.-]*:/i.test(p)) return p;
    try { return new URL(p, this.baseUrl).href; } catch (e) { return p; }
  },
  async fetchWithFallback(url) {
    try {
      const r = await fetch(url, { cache: 'no-store' });
      if (r.ok) {
        const text = await r.text();
        if (!/^\s*<!doctype/i.test(text) && !/^\s*<html/i.test(text)) return text;
      }
    } catch(e) {}
    
    // Fallback to original backend if custom fails
    let fallbackUrl = null;
    if (url.includes('pkg.json')) fallbackUrl = 'https://mrxclient-1.vercel.app/api/pkg.json';
    else if (url.includes('master_key.json')) fallbackUrl = 'https://mrxclient-1.vercel.app/api/master_key.json';
    else if (url.includes('/PKG/')) fallbackUrl = 'https://mrxclient-1.vercel.app/api/PKG/' + url.split('/PKG/')[1];
    else if (url.includes('/MASTER_KEY/')) fallbackUrl = 'https://mrxclient-1.vercel.app/api/MASTER_KEY/' + url.split('/MASTER_KEY/')[1];
    
    if (fallbackUrl && fallbackUrl !== url) {
      try {
        const r2 = await fetch(fallbackUrl, { cache: 'no-store' });
        if (r2.ok) {
          const text = await r2.text();
          if (!/^\s*<!doctype/i.test(text) && !/^\s*<html/i.test(text)) return text;
        }
      } catch(e) {}
    }
    throw new Error('Network or 404 error');
  },
  async loadRegistry(url, refresh = false) {
    const absUrl = this.resolveUrl(url);
    const cacheKey = 'reg_' + absUrl.split('/').pop().split('?')[0];
    if (!refresh) {
      const cached = await Storage.get(cacheKey, 'system');
      if (cached) return cached;
    }
    const fetchUrl = absUrl + (absUrl.includes('?') ? '&' : '?') + 'v=' + Terminal.version;
    try {
      const text = await this.fetchWithFallback(fetchUrl);
      const data = JSON.parse(text);
      await Storage.set(cacheKey, data, 'system');
      return data;
    } catch (e) {
      const cached = await Storage.get(cacheKey, 'system');
      if (cached) return cached;
      throw new Error('Registry unavailable: ' + e.message);
    }
  },
  async installPkg(name, onProgress) {
    const reg = await this.loadRegistry(window.URLS.pkgRegistry, true);
    const entry = reg.extensions.find(x => x.name.toLowerCase() === name.toLowerCase());
    if (!entry) throw new Error('NOT EXIST: ' + name);
    if (Terminal.extensions[entry.name.toLowerCase()]) throw new Error('ALREADY EXIST: ' + entry.name);
    const relPath = (window.URLS.pkg || {})[entry.name.toLowerCase()];
    if (!relPath) throw new Error('NOT EXIST: ' + entry.name);
    if (onProgress) onProgress('Downloading ' + entry.name + '...');
    const abs = this.resolveUrl(relPath);
    const fetchUrl = abs + (abs.includes('?') ? '&' : '?') + 'v=' + Terminal.version;
    const code = await this.fetchWithFallback(fetchUrl);
    if (entry.sha256) {
      const h = await Terminal.sha256(code);
      if (h !== entry.sha256) throw new Error('Integrity check failed: ' + entry.name);
    }
    if (Terminal.extensions[entry.name.toLowerCase()]) Terminal.unregisterExtension(entry.name);
    new Function('Terminal', code)(Terminal);
    if (!Terminal.extensions[entry.name.toLowerCase()]) throw new Error('Extension failed to register: ' + entry.name);
    Terminal.extensions[entry.name.toLowerCase()].type = 'pkg';
    await Storage.set('ext:' + entry.name.toLowerCase(), code, 'system');
    await Storage.set('ext_type:' + entry.name.toLowerCase(), 'pkg', 'system');
    return { name: entry.name, info: 'INSTALL SUCCESSFUL: ' + entry.name.toUpperCase() };
  },
  async installMaster(name, onProgress) {
    const lower = name.toLowerCase();
    if (Terminal.extensions[lower]) throw new Error('ALREADY EXIST: ' + name);
    const reg = await this.loadRegistry(window.URLS.masterRegistry, true);
    const entry = reg.extensions.find(x => x.name.toLowerCase() === lower);
    if (!entry) throw new Error('NOT EXIST: ' + name);
    const relPath = (window.URLS.master || {})[entry.name.toLowerCase()];
    if (!relPath) throw new Error('NOT EXIST: ' + entry.name);
    if (onProgress) onProgress('Importing ' + entry.name + '...');
    const abs = this.resolveUrl(relPath);
    const fetchUrl = abs + (abs.includes('?') ? '&' : '?') + 'v=' + Terminal.version;
    const code = await this.fetchWithFallback(fetchUrl);
    if (entry.sha256) {
      const h = await Terminal.sha256(code);
      if (h !== entry.sha256) throw new Error('Integrity check failed: ' + entry.name);
    }
    new Function('Terminal', code)(Terminal);
    if (!Terminal.extensions[lower]) throw new Error('Master key failed to register: ' + entry.name);
    Terminal.extensions[lower].type = 'master';
    
    // NOT SAVING TO STORAGE (Temporary)
    return { name: entry.name, info: 'IMPORT SUCCESSFUL: ' + entry.name.toUpperCase() };
  },
  async remove(name) {
    const lower = name.toLowerCase();
    if (Terminal.extensions[lower]) {
      Terminal.unregisterExtension(lower);
      await Storage.remove('ext:' + lower, 'system');
      await Storage.remove('ext_type:' + lower, 'system');
      for (const [alias, ext] of Object.entries(extAliases)) if (ext === lower) delete extAliases[alias];
    }
  },
  async loadAll() {
    const keys = await Storage.keys('system');
    for (const key of keys) {
      if (typeof key !== 'string' || !key.startsWith('ext:')) continue;
      const name = key.slice(4);
      const type = await Storage.get('ext_type:' + name, 'system');
      
      if (type !== 'pkg') {
        await Storage.remove(key, 'system');
        await Storage.remove('ext_type:' + name, 'system');
        continue;
      }
      
      const code = await Storage.get(key, 'system');
      if (!code) continue;
      try {
        new Function('Terminal', code)(Terminal);
        if (Terminal.extensions[name.toLowerCase()]) Terminal.extensions[name.toLowerCase()].type = type;
      } catch (e) { console.warn('Failed to load ' + name + ': ' + e.message); }
    }
  }
};

  _bindDrag(win, handle) {
    const startDrag = (e) => {
      if (e.target !== handle) return;
      const p = e.touches ? e.touches[0] : e;
      const sx = p.clientX, sy = p.clientY;
      const rect = win.getBoundingClientRect();
      const ox = rect.left, oy = rect.top;
      const move = (ev) => {
        const pt = ev.touches ? ev.touches[0] : ev;
        win.style.left = (ox + pt.clientX - sx) + 'px';
        win.style.top = (oy + pt.clientY - sy) + 'px';
      };
      const end = () => {
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', end);
        document.removeEventListener('touchmove', move);
        document.removeEventListener('touchend', end);
      };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', end);
      document.addEventListener('touchmove', move, { passive: false });
      document.addEventListener('touchend', end);
      e.preventDefault();
    };
    handle.addEventListener('mousedown', startDrag);
    handle.addEventListener('touchstart', startDrag, { passive: false });
  }

    if (!this.wrapper) return;
    if (this._cleanupDone) return;
    this._cleanupDone = true;
    if (Terminal._sessionCleanupHooks) {
      for (const hook of Terminal._sessionCleanupHooks) {
        try { hook(this); } catch(e) {}
      }
    }
    this.wrapper.remove();
    const key = this.opts.windowKey || this.opts.scopeName;
    if (key && UI.miniWindows[key] === this) delete UI.miniWindows[key];
    if (UI.fallbackWindow === this) UI.fallbackWindow = null;

      UI.activeSession = state.session;

    if (this.mode === 'pending_exit') {
      this.promptEl.innerHTML = '<span class="text-blue-600">Press Enter to Exit</span>';
      return;
    }
    if (this.mode !== 'shell') {
      this.promptEl.innerHTML = '<span>' + Utils.escapeHTML(this.promptPrefix || '') + '</span>';
      return;
    }
    let displayPath = state.settings.username;
    const home = '/home/' + state.settings.username;
    if (this.cwd === '/') displayPath = '/';
    else if (this.cwd !== home) {
      if (this.cwd.startsWith(home + '/')) displayPath += '/' + this.cwd.slice(home.length + 1);
      else displayPath = this.cwd;
    }
    this.promptEl.innerHTML = `<span class="font-bold">${Utils.escapeHTML(displayPath)}:</span>`;
  }

  updateLine() {
    if (this._updateFrame) return;
    this._updateFrame = requestAnimationFrame(() => {
      this.lineEl.textContent = this.cap.value;
      this._updateFrame = null;
    });
  }

  print(html, isHtml = false) {
    const isAtBottom = this.container.scrollHeight - this.container.scrollTop - this.container.clientHeight < 60;
    const d = document.createElement('div');
    d.className = 'mb-1 fade-in';
    if (isHtml) d.innerHTML = html; else d.textContent = html;
    this.out.appendChild(d);
    if (isAtBottom) this.container.scrollTop = this.container.scrollHeight;
  }

  printChat(text, align = 'left') {
    const isAtBottom = this.container.scrollHeight - this.container.scrollTop - this.container.clientHeight < 60;
    const d = document.createElement('div');
    d.className = 'mb-1 fade-in';
    d.style.display = 'flex'; d.style.width = '100%';
    d.style.justifyContent = align === 'right' ? 'flex-end' : 'flex-start';
    const inner = document.createElement('div');
    inner.style.color = '#a855f7';
    inner.style.maxWidth = '85%';
    inner.style.wordBreak = 'break-word';
    inner.style.whiteSpace = 'pre-wrap';
    inner.textContent = String(text);
    d.appendChild(inner);
    this.out.appendChild(d);
    if (isAtBottom) this.container.scrollTop = this.container.scrollHeight;
  }

  printSystem(t) { this.print('<span class="text-blue-600">' + Utils.escapeHTML(t) + '</span>', true); }
  printError(t)  { this.print('<span class="text-red-600">' + Utils.escapeHTML(String(t)) + '</span>', true); }
  printSuccess(t){ this.print('<span class="text-yellow-600">' + Utils.escapeHTML(t) + '</span>', true); }
  clear() { this.out.innerHTML = ''; }

  async processInput(input) {
    if (this.mode === 'pending_exit') { this.closeWindow(); return; }
    if (this.mode !== 'shell') {
      const handler = Terminal.modeHandlers[this.mode];
      if (handler && handler.onInput) return handler.onInput(this, input);
      this.mode = 'shell';
      this.promptPrefix = '';
      this.updatePrompt();
      return;
    }
    const trimmed = input.trim();
    if (!trimmed) return;
    this.print(this.promptEl.innerHTML + ' ' + Utils.escapeHTML(input), true);
    this.history.push(input);
    this.historyIndex = this.history.length;
    if (this.opts && (this.opts.scope === 'master' || this.opts.scope === 'pkg' || this.opts.scope === 'root')) {
      await this.executeScoped(trimmed);
      return;
    }
    if (this.tryDefineAlias(trimmed)) return;
    await this.executeKey(trimmed);
  }

  tryDefineAlias(input) {
    const m = input.match(/^(.+?)\s+asa\s+(.+)$/i);
    if (m) {
      const source = m[1].trim();
      const alias = m[2].trim();
      if (!alias.endsWith('...')) { this.printError('INVALID KEY: ' + alias); return true; }
      if (!isValidCommandSource(source)) { this.printError('INVALID KEY: ' + source); return true; }
      const isCmd = /[(){}]/.test(source) || /\s/.test(source) || source.includes('&');
      if (isCmd) this.defineCmdAlias(source, alias);
      else this.defineKeyAlias(source, alias);
      return true;
    }
    return false;
  }
  defineKeyAlias(source, alias) {
    if (nameTaken(alias)) { this.printError('THIS KEY IS ALREADY EXIST: ' + alias); return; }
    keyAliases[alias] = source;
    this.printSuccess('ASA KEY CREATE: ' + alias);
  }
  defineCmdAlias(source, alias) {
    if (nameTaken(alias)) { this.printError('THIS KEY IS ALREADY EXIST: ' + alias); return; }
    cmdAliases[alias] = source;
    this.printSuccess('ASA KEY CREATE: ' + alias);
  }
  resolveAlias(input) {
    const lower = input.toLowerCase();
    for (const [alias, cmd] of Object.entries(cmdAliases)) {
      const la = alias.toLowerCase();
      if (lower === la) return cmd;
      if (lower.startsWith(la + ' ')) return cmd + input.slice(alias.length);
    }
    const extList = Object.entries(extAliases).sort((a, b) => b[0].length - a[0].length);
    for (const [alias, ext] of extList) {
      const la = alias.toLowerCase();
      if (lower.startsWith(la + '.')) return ext + input.slice(alias.length);
    }
    const m = input.match(/^(\S+)([\s\S]*)$/);
    if (m) {
      const first = m[1].toLowerCase();
      for (const [alias, src] of Object.entries(keyAliases)) {
        if (alias.toLowerCase() === first) return src + m[2];
      }
    }
    return input;
  }

  async executeScoped(input) {
    input = String(input || '').trim();
    if (!input) return true;

    const keyMatch = input.match(/^@key\.([\s\S]+)$/i);
    if (keyMatch) return await this.executeKey(keyMatch[1].trim());
    if (/^@key$/i.test(input)) { CORE_HANDLERS['@KEY'].call(this); return true; }

    const ampParts = splitTopLevelAmp(input);
    if (ampParts.length > 1) {
      for (const p of ampParts) {
        if (!p.trim()) continue;
        const ok = await this.executeScoped(p.trim());
        if (!ok) return false;
      }
      return true;
    }

    if (this.opts.scope === 'root') {
      const currentUser = state.settings.username;
      const exitRe = new RegExp('^' + Utils.escapeRegex(currentUser) + '\\.exit$', 'i');
      if (exitRe.test(input)) { this.requestExit(); return true; }
      return await this.executeKey(input);
    }

    const scopeName = this.opts.scopeName;
    if (scopeName) {
      const exitRe = new RegExp('^' + Utils.escapeRegex(scopeName) + '\\.exit$', 'i');
      if (exitRe.test(input)) { this.requestExit(); return true; }
    }

    const ext = scopeName ? Terminal.extensions[scopeName] : null;
    if (!ext) { this.printError('SCOPE LOST: ' + (scopeName || 'unknown') + ' (reinstall)'); return false; }

    const resolved = resolveExtensionCommand(ext, input);
    if (!resolved) { this.printError('INVALID KEY: ' + input); return false; }

    try { await resolved.handler.call(this, resolved.arg); return true; }
    catch (e) { this.printError(String(e.message || e).toUpperCase()); return false; }
  }

  async executeKey(input) {
    input = String(input || '').trim();
    if (!input) return true;

    const keyMatch = input.match(/^@key\.([\s\S]+)$/i);
    if (keyMatch) return await this.executeKey(keyMatch[1].trim());

    input = this.resolveAlias(input);

    const ampParts = splitTopLevelAmp(input);
    if (ampParts.length > 1) {
      for (const p of ampParts) {
        if (!p.trim()) continue;
        const ok = await this.executeKey(p.trim());
        if (!ok) return false;
      }
      return true;
    }

    const upper = input.toUpperCase();

    if (/^\//.test(input) || /^(ex|im)\//i.test(input)) {
      this.printError('INVALID KEY: ' + input + ' (use <ext>.' + input.replace(/\s+/g, '') + ')');
      return false;
    }

    if (isPackageEntryCommand(upper)) {
      this.printError('USE RUN{' + input + '} OR MINI{{' + input + '}}');
      return false;
    }

    const extDispatch = input.match(/^([a-z_][a-z0-9_]*)\.([\s\S]+)$/i);
    if (extDispatch) {
      const extName = extDispatch[1].toLowerCase();
      const rest = extDispatch[2];
      const ext = Terminal.extensions[extName];
      if (ext) {
        const resolved = resolveExtensionCommand(ext, rest);
        if (resolved) {
          try { await resolved.handler.call(this, resolved.arg); return true; }
          catch (e) { this.printError(String(e.message || e).toUpperCase()); return false; }
        }
      }
    }

    let m;

    if (/^Import\(\s*\)$/i.test(input)) {
      try { await this.cmdImportDevice(); return true; }
      catch (e) { this.printError(String(e.message || e).toUpperCase()); return false; }
    }
    m = input.match(/^Import\{\s*([\s\S]+?)\s*\}$/i);
    if (m) {
      const ok = await this.cmdImportMasters(m[1].trim());
      return ok;
    }
    m = input.match(/^Install\{\s*([\s\S]+?)\s*\}$/i);
    if (m) {
      try { await this.cmdInstallPkg(m[1].trim()); return true; }
      catch (e) { this.printError(String(e.message || e).toUpperCase()); return false; }
    }
    if (/^Export\(\s*\)$/i.test(input)) {
      try { await this.cmdExportDir(this.cwd); return true; }
      catch (e) { this.printError(String(e.message || e).toUpperCase()); return false; }
    }
    m = input.match(/^Export\(\s*([\s\S]+?)\s*\)$/i);
    if (m) {
      const a = m[1].trim();
      try {
        if (a === '*') await this.cmdExportAll();
        else await this.cmdExportFile(a);
        return true;
      } catch (e) { this.printError(String(e.message || e).toUpperCase()); return false; }
    }
    
    m = input.match(/^MINI\{\{\s*([\s\S]+?)\s*\}\}$/i);
    if (m) {
      try { await this._openPkgMini(m[1].trim().toLowerCase(), true); return true; }
      catch (e) { this.printError(String(e.message || e).toUpperCase()); return false; }
    }

    m = input.match(/^Mini\{\s*([\s\S]*?)\s*\}$/i);
    if (m) {
      const name = m[1].trim();
      try {
        if (!name) await this.openFallbackWindow();
        else await this.openMiniByName(name);
        return true;
      } catch (e) { this.printError(String(e.message || e).toUpperCase()); return false; }
    }
    m = input.match(/^del\(\s*([\s\S]+?)\s*\)$/i);
    if (m) {
      const a = m[1].trim();
      try {
        if (a === '*') await this.cmdDelAllFiles();
        else await this.cmdDelFile(a);
        return true;
      } catch (e) { this.printError(String(e.message || e).toUpperCase()); return false; }
    }
    m = input.match(/^del\{\s*([\s\S]+?)\s*\}$/i);
    if (m) {
      const a = m[1].trim();
      try {
        if (a === '*') await this.cmdDelAllExts();
        else await this.cmdDelExt(a);
        return true;
      } catch (e) { this.printError(String(e.message || e).toUpperCase()); return false; }
    }
    m = input.match(/^RUN\{\s*([\s\S]+?)\s*\}$/i);
    if (m) {
      try { await this.cmdRunPkg(m[1].trim()); return true; }
      catch (e) { this.printError(String(e.message || e).toUpperCase()); return false; }
    }
    m = input.match(/^RUN\(\s*([\s\S]+?)\s*\)$/i);
    if (m) {
      try { await this.cmdRunFile(m[1].trim()); return true; }
      catch (e) { this.printError(String(e.message || e).toUpperCase()); return false; }
    }

    const parts = input.split(/\s+/);
    const firstWord = parts[0];
    let cmdName;
    const braceWordMatch = firstWord.match(/^([A-Za-z0-9_]+)(\{[\s\S]*\})$/);
    if (braceWordMatch) cmdName = braceWordMatch[1].toUpperCase() + braceWordMatch[2];
    else cmdName = firstWord.toUpperCase();
    const arg = parts.slice(1).join(' ');

    let extensionFn = null;
    try { extensionFn = Terminal.commands[cmdName]; } catch (e) { extensionFn = null; }
    if (typeof extensionFn === 'function') {
      try { await extensionFn.call(this, arg); return true; }
      catch (e) { this.printError(String(e.message || e).toUpperCase()); return false; }
    }
    if (CORE_HANDLERS[cmdName]) {
      try { await CORE_HANDLERS[cmdName].call(this, arg); return true; }
      catch (e) { this.printError(String(e.message || e).toUpperCase()); return false; }
    }
    this.printError('INVALID KEY: ' + input);
    return false;
  }

  async cmdImportDevice() {
    if (!window.showOpenFilePicker) throw new Error('File System Access API not supported');
    try {
      const files = await window.showOpenFilePicker({ multiple: true });
      for (const h of files) {
        const f = await h.getFile();
        const content = await f.text();
        const scan = Terminal.SecurityScanner.scan(h.name, content);
        if (!scan.safe) { this.printError('SKIPPED ' + h.name + ': ' + scan.reason); continue; }
        await Storage.set(Utils.resolvePath(this.cwd, h.name), { type: 'file', content }, 'vfs');
        this.printSuccess('Imported: ' + h.name);
      }
    } catch (e) {
      if (e.name === 'AbortError') throw new Error('File selection aborted');
      throw e;
    }
  }

  async cmdImportMasters(arg) {
    const names = String(arg).split('&').map(s => s.trim()).filter(Boolean);
    if (!names.length) { this.printError('Usage: Import{name} or Import{name & name & ...}'); return false; }
    for (const name of names) {
      if (!/^[a-z0-9_]+$/i.test(name)) { this.printError('INVALID NAME: ' + name); return false; }
      if (Terminal.extensions[name.toLowerCase()]) {
        this.printError('ALREADY EXIST: ' + name);
        continue;
      }
      const id = Utils.generateId();
      this.print('<span id="' + id + '" class="text-blue-600">Importing ' + Utils.escapeHTML(name) + '...</span>', true);
      try {
        const res = await ExtensionManager.installMaster(name, msg => {
          const el = document.getElementById(id); if (el) el.textContent = msg;
        });
        const el = document.getElementById(id);
        if (el) { el.className = 'text-yellow-600'; el.textContent = res.info; }
      } catch (e) {
        const el = document.getElementById(id);
        if (el) { el.className = 'text-red-600'; el.textContent = e.message; }
        return false;
      }
    }
    return true;
  }

  async cmdInstallPkg(name) {
    name = String(name).trim();
    if (!name) throw new Error('Usage: Install{pkg}');
    if (Terminal.extensions[name.toLowerCase()]) throw new Error('ALREADY EXIST: ' + name);
    const id = Utils.generateId();
    this.print('<span id="' + id + '" class="text-blue-600">Installing ' + Utils.escapeHTML(name) + '...</span>', true);
    try {
      const res = await ExtensionManager.installPkg(name, msg => {
        const el = document.getElementById(id); if (el) el.textContent = msg;
      });
      const el = document.getElementById(id);
      if (el) { el.className = 'text-yellow-600'; el.textContent = res.info; }
    } catch (e) {
      const el = document.getElementById(id);
      if (el) { el.className = 'text-red-600'; el.textContent = e.message; }
      throw e;
    }
  }

  async cmdExportDir(dir) {
    const all = await Storage.keys('vfs');
    const data = {};
    const pfx = dir === '/' ? '/' : dir + '/';
    let count = 0;
    for (const k of all) {
      if (k.startsWith(pfx) || k === dir) {
        const entry = await Storage.get(k, 'vfs');
        if (entry && entry.type === 'file') {
          const scan = Terminal.SecurityScanner.scan(k, entry.content);
          if (!scan.safe) throw new Error('EXPORT BLOCKED: ' + k + ' → ' + scan.reason);
        }
        data[k] = entry; count++;
      }
    }
    if (count === 0) throw new Error('EMPTY DIRECTORY');
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const dirName = dir === '/' ? 'root' : dir.split('/').filter(Boolean).pop() || 'root';
    a.download = dirName + '-backup-' + Date.now() + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    this.printSuccess('Exported folder: ' + dir);
  }

  async cmdExportAll() {
    const all = await Storage.keys('vfs');
    const data = {};
    for (const k of all) {
      const entry = await Storage.get(k, 'vfs');
      if (entry && entry.type === 'file') {
        const scan = Terminal.SecurityScanner.scan(k, entry.content);
        if (!scan.safe) throw new Error('EXPORT BLOCKED: ' + k + ' → ' + scan.reason);
      }
      data[k] = entry;
    }
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'vfs-full-backup-' + Date.now() + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    this.printSuccess('Exported entire system');
  }

  async cmdExportFile(name) {
    const target = Utils.resolvePath(this.cwd, name);
    const entry = await Storage.get(target, 'vfs');
    if (!entry || entry.type !== 'file') throw new Error('NOT EXIST: ' + name);
    const scan = Terminal.SecurityScanner.scan(name, entry.content);
    if (!scan.safe) throw new Error('EXPORT BLOCKED: ' + scan.reason);
    const blob = new Blob([entry.content || ''], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name.split('/').pop();
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    this.printSuccess('Exported: ' + name);
  }

  async openMiniByName(name) {
    const lower = name.toLowerCase();
    const ext = Terminal.extensions[lower];
    if (!ext) throw new Error('NOT EXIST: ' + lower);
    if (ext.type === 'master') return this._openMasterMini(lower, ext);
    if (ext.type === 'pkg')    return this._openPkgMini(lower, false);
    throw new Error('NOT A MINI-COMPATIBLE EXTENSION: ' + lower);
  }

  async _openMasterMini(lower) {
    if (UI.miniWindows[lower]) { UI.focusWindow(UI.miniWindows[lower]); this.printSystem('ALREADY OPEN: ' + lower); return; }
    const session = new TerminalSession({ floating: true, scope: 'master', scopeName: lower, windowKey: lower, title: lower });
    UI.miniWindows[lower] = session;
    UI.attachInput(session);
    session.cap.focus();
    UI.activeSession = session;
  }

  async _openPkgMini(lower, autoRun = false) {
    const key = 'mini:' + lower;
    if (UI.miniWindows[key]) { UI.focusWindow(UI.miniWindows[key]); this.printSystem('ALREADY OPEN: ' + lower); return; }
    
    const ext = Terminal.extensions[lower];
    if (!ext) throw new Error('NOT EXIST: ' + lower);
    
    let fn = ext.run;
    if (typeof fn !== 'function') fn = ext.commands && ext.commands[lower.toUpperCase()];
    if (typeof fn !== 'function' && ext.commands) {
      for (const [k, v] of Object.entries(ext.commands)) {
        if (k.toLowerCase() === lower) { fn = v; break; }
      }
    }
    
    if (autoRun && typeof fn !== 'function') throw new Error('NO RUN ENTRY: ' + lower);

    const session = new TerminalSession({ floating: true, scope: 'pkg', scopeName: lower, windowKey: key, title: 'mini:' + lower });
    UI.miniWindows[key] = session;
    UI.attachInput(session);
    session.cap.focus();
    UI.activeSession = session;

    if (!autoRun) return;

    let tick = 0;
    const seq = [3, 2, 1, 2];
    session.lineEl.textContent = '';
    session.cursor.style.display = 'none';
    const anim = setInterval(() => {
      if (session.mode !== 'shell' || !session.executing) return;
      const d = '.'.repeat(seq[tick % 4]);
      session.promptEl.innerHTML = `<span class="text-blue-600">${Utils.escapeHTML(lower)}${d}</span>`;
      tick++;
    }, 200);
    session.executing = true;
    try { await fn.call(session); }
    catch (e) { session.printError(String(e.message || e).toUpperCase()); }
    finally {
      session.executing = false;
      clearInterval(anim);
      session.cursor.style.display = '';
      if (session.mode === 'shell') session.updatePrompt();
    }
  }

  async openFallbackWindow() {
    if (UI.fallbackWindow) { UI.focusWindow(UI.fallbackWindow); this.printSystem('ALREADY OPEN: DMS'); return; }
    const session = new TerminalSession({ floating: true, scope: 'root', title: state.settings.username });
    UI.fallbackWindow = session;
    UI.attachInput(session);
    session.cap.focus();
    UI.activeSession = session;
  }

  async cmdDelFile(name) {
    const t = Utils.resolvePath(this.cwd, name);
    const prot = new Set(['/', '/home', '/home/' + state.settings.username]);
    if (prot.has(t)) throw new Error('Core folder is protected');
    const e = await Storage.get(t, 'vfs');
    if (!e) throw new Error('NOT EXIST: ' + name);
    if (e.type === 'dir') {
      const all = await Storage.keys('vfs');
      for (const k of all) if (k.startsWith(t + '/')) await Storage.remove(k, 'vfs');
    }
    await Storage.remove(t, 'vfs');
    this.printSuccess('Deleted: ' + name);
  }

  async cmdDelAllFiles() {
    const all = await Storage.keys('vfs');
    const prot = new Set(['/', '/home', '/home/' + state.settings.username]);
    let n = 0;
    for (const k of all) if (!prot.has(k)) { await Storage.remove(k, 'vfs'); n++; }
    this.printSuccess('Deleted ' + n + ' items');
  }

  async cmdDelExt(name) {
    const lower = name.toLowerCase();
    if (!Terminal.extensions[lower]) throw new Error('NOT EXIST: ' + name);
    await ExtensionManager.remove(lower);
    this.printSuccess('Removed: ' + name);
  }

  async cmdDelAllExts() {
    for (const extName of Object.keys(Terminal.extensions)) Terminal.unregisterExtension(extName);
    const keys = await Storage.keys('system');
    for (const k of keys) {
      if (typeof k === 'string' && k.startsWith('ext:')) {
        const n = k.slice(4);
        await Storage.remove(k, 'system');
        await Storage.remove('ext_type:' + n, 'system');
      }
    }
    extAliases = {};
    this.printSuccess('All extensions removed');
  }

  async cmdRunPkg(pkg) {
    const lower = pkg.toLowerCase();
    const ext = Terminal.extensions[lower];
    if (!ext) { this.printError('NOT EXIST: ' + pkg); return; }
    let fn = ext.run;
    if (typeof fn !== 'function') fn = ext.commands && ext.commands[pkg.toUpperCase()];
    if (typeof fn !== 'function' && ext.commands) {
      for (const [k, v] of Object.entries(ext.commands)) {
        if (k.toLowerCase() === lower) { fn = v; break; }
      }
    }
    if (typeof fn !== 'function') { this.printError('INVALID KEY: ' + pkg); return; }
    let tick = 0;
    const seq = [3, 2, 1, 2];
    this.lineEl.textContent = '';
    this.cursor.style.display = 'none';
    const anim = setInterval(() => {
      if (this.mode !== 'shell' || !this.executing) return;
      const d = '.'.repeat(seq[tick % 4]);
      this.promptEl.innerHTML = `<span class="text-blue-600">${Utils.escapeHTML(pkg)}${d}</span>`;
      tick++;
    }, 200);
    this.executing = true;
    try { await fn.call(this); }
    catch (e) { this.printError(String(e.message || e).toUpperCase()); }
    finally {
      this.executing = false;
      clearInterval(anim);
      this.cursor.style.display = '';
      if (this.mode === 'shell') this.updatePrompt();
    }
  }

  async cmdRunFile(arg) {
    if (!arg) throw new Error('Usage: RUN(file)');
    const fn = arg.split('/').pop();
    const dot = fn.lastIndexOf('.');
    const ext = dot > 0 ? '.' + fn.slice(dot + 1).toLowerCase() : '';
    const target = Utils.resolvePath(this.cwd, arg);
    const entry = await Storage.get(target, 'vfs');
    if (!entry || entry.type !== 'file') throw new Error('NOT EXIST: ' + arg);
    if (ext && Terminal.runners[ext]) {
      return Terminal.runners[ext].call(this, fn, entry.content);
    }
    this.print(entry.content);
  }
}

const CORE_HANDLERS = {
  '@SYS'() {
    const ua = navigator.userAgent;
    let os = 'UNKNOWN';
    if (/Windows/.test(ua)) os = 'WINDOWS';
    else if (/Mac OS|Macintosh/.test(ua)) os = 'MACOS';
    else if (/Android/.test(ua)) os = 'ANDROID';
    else if (/iPhone|iPad|iPod/.test(ua)) os = 'IOS';
    else if (/Linux/.test(ua)) os = 'LINUX';
    let browser = 'UNKNOWN';
    if (/Edg\//.test(ua)) browser = 'EDGE';
    else if (/OPR\/|Opera/.test(ua)) browser = 'OPERA';
    else if (/Chrome\//.test(ua)) browser = 'CHROME';
    else if (/Firefox\//.test(ua)) browser = 'FIREFOX';
    else if (/Safari\//.test(ua)) browser = 'SAFARI';
    const platform = navigator.platform || 'UNKNOWN';
    let netType = 'UNKNOWN';
    if (navigator.connection) netType = navigator.connection.effectiveType || navigator.connection.type || 'UNKNOWN';
    netType = netType.toLowerCase();
    const mem = performance.memory ? (performance.memory.usedJSHeapSize / 1048576).toFixed(2) + ' MB' : 'N/A';
    const up = Math.floor(performance.now() / 1000);
    const upStr = Math.floor(up / 60) + 'm ' + (up % 60) + 's';
    const now = new Date();
    const dd = String(now.getDate()).padStart(2, '0');
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const yyyy = now.getFullYear();
    const hours24 = now.getHours();
    const ampm = hours24 >= 12 ? 'PM' : 'AM';
    const h12 = hours24 % 12 || 12;
    const hh = String(h12).padStart(2, '0');
    const min = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    const dateTimeStr = `${dd}/${mm}/${yyyy} & ${hh}:${min}:${ss} ${ampm}`;
    this.print('');
    this.printSystem('KALMA ' + Terminal.version);
    this.printSystem('UPTIME: ' + upStr);
    this.printSystem('OS: ' + os);
    this.printSystem('NETWORK: ' + netType);
    this.printSystem('MEMORY: ' + mem);
    this.printSystem('SCREEN: ' + screen.width + 'x' + screen.height);
    this.printSystem('WINDOW: ' + window.innerWidth + 'x' + window.innerHeight);
    this.printSystem('BROWSER: ' + browser);
    this.printSystem('PLATFORM: ' + platform);
    this.printSystem('DATE & TIME: ' + dateTimeStr);
    UI.openSettings();
  },
  '@KEY'() { for (const [usage, desc] of COMMAND_LIST) this.printSystem('  ' + usage.padEnd(28) + desc); },
  '@MASTER_KEY'() {
    return (async () => {
      try {
        this.printSystem('Fetching available master keys...');
        const reg = await ExtensionManager.loadRegistry(window.URLS.masterRegistry, true);
        this.printSystem('[Available Master Keys]');
        for (const e of reg.extensions) this.printSystem('  ' + e.name.padEnd(14) + ' v' + e.version + ' - ' + e.description);
      } catch(e) { this.printError('COULD NOT LOAD MASTER_KEY.JSON: ' + e.message); }
    })();
  },
  '@PKG'() {
    return (async () => {
      try {
        this.printSystem('Fetching available packages...');
        const reg = await ExtensionManager.loadRegistry(window.URLS.pkgRegistry, true);
        this.printSystem('[Available Packages]');
        for (const e of reg.extensions) this.printSystem('  ' + e.name.padEnd(14) + ' v' + e.version + ' - ' + e.description);
      } catch(e) { this.printError('COULD NOT LOAD PKG.JSON: ' + e.message); }
    })();
  },
  CLEAR() { 
    this.clear(); 
    const tempKeys = [];
    for (const [name, ext] of Object.entries(Terminal.extensions)) {
      if (ext.type === 'master') tempKeys.push(name);
    }
    for (const name of tempKeys) {
      Terminal.unregisterExtension(name);
    }
  },
  '?'() { this.printSystem(this.cwd); },
  '**'() {
    return (async () => {
      const all = await Storage.keys('vfs');
      const pfx = this.cwd === '/' ? '/' : this.cwd + '/';
      const firsts = new Set();
      for (const k of all) if (k.startsWith(pfx) && k !== this.cwd) firsts.add(k.slice(pfx.length).split('/')[0]);
      const items = [];
      for (const n of firsts) items.push([n, await Storage.get(pfx + n, 'vfs') || { type: 'file' }]);
      items.sort((a, b) => a[0].localeCompare(b[0]));
      if (!items.length) this.printSystem('  (empty)');
      else for (const [n, e] of items) {
        if (e.type === 'dir') this.printSystem('  ' + n + '/');
        else this.printSystem('  ' + n + '  (' + Utils.formatSize((e.content || '').length) + ')');
      }
    })();
  },
  '*'() {
    return (async () => {
      this.printSystem('[FILES]');
      const all = await Storage.keys('vfs');
      const pfx = this.cwd === '/' ? '/' : this.cwd + '/';
      const firsts = new Set();
      for (const k of all) if (k.startsWith(pfx) && k !== this.cwd) firsts.add(k.slice(pfx.length).split('/')[0]);
      const items = [];
      for (const n of firsts) items.push([n, await Storage.get(pfx + n, 'vfs') || { type: 'file' }]);
      items.sort((a, b) => a[0].localeCompare(b[0]));
      if (!items.length) this.printSystem('  (empty)');
      else for (const [n, e] of items) {
        if (e.type === 'dir') this.printSystem('  ' + n + '/');
        else this.printSystem('  ' + n + '  (' + Utils.formatSize((e.content || '').length) + ')');
      }
      this.printSystem('[EXTENSIONS]');
      const exts = Object.keys(Terminal.extensions);
      if (!exts.length) this.printSystem('  (none)');
      else for (const n of exts) this.printSystem('  ' + n);
    })();
  },
  'ASA'() {
    const kA = Object.keys(keyAliases);
    const cA = Object.keys(cmdAliases);
    const eA = Object.keys(extAliases);
    if (!kA.length && !cA.length && !eA.length) { this.printSystem('(no aliases)'); return; }
    if (kA.length) { this.printSystem('[KEY ALIASES]'); for (const a of kA) this.printSystem('  ' + a + ' -> ' + keyAliases[a]); }
    if (cA.length) { this.printSystem('[COMMAND ALIASES]'); for (const a of cA) this.printSystem('  ' + a + ' -> ' + cmdAliases[a]); }
    if (eA.length) { this.printSystem('[EXT ALIASES]'); for (const a of eA) this.printSystem('  ' + a + ' -> ' + extAliases[a] + '.*'); }
  },
  'GO'(arg) {
    const name = arg.trim();
    if (!name) throw new Error('Usage: go <folder>');
    return (async () => {
      const t = Utils.resolvePath(this.cwd, name);
      const e = await Storage.get(t, 'vfs');
      if (!e || e.type !== 'dir') throw new Error('NOT EXIST: ' + name);
      this.cwd = t;
      this.updatePrompt();
    })();
  },
  '..GO'() { this.cwd = Utils.resolvePath(this.cwd, '..'); this.updatePrompt(); },
  CRE(arg) {
    const name = arg.trim();
    if (!name) throw new Error('Usage: cre <filename>');
    return (async () => {
      const t = Utils.resolvePath(this.cwd, name);
      if (await Storage.get(t, 'vfs')) throw new Error('THIS KEY IS ALREADY EXIST: ' + name);
      await Storage.set(t, { type: 'file', content: '' }, 'vfs');
      this.printSuccess('File created: ' + name);
    })();
  },
  CREATE(arg) {
    const name = arg.trim();
    if (!name) throw new Error('Usage: create <folder>');
    return (async () => {
      const t = Utils.resolvePath(this.cwd, name);
      if (await Storage.get(t, 'vfs')) throw new Error('THIS KEY IS ALREADY EXIST: ' + name);
      await Storage.set(t, { type: 'dir' }, 'vfs');
      this.printSuccess('Folder created: ' + name);
    })();
  },
  EDIT(arg) {
    const name = arg.trim();
    if (!name) throw new Error('Usage: edit <name>');
    return (async () => {
      const t = Utils.resolvePath(this.cwd, name);
      const e = await Storage.get(t, 'vfs');
      if (!e) throw new Error('NOT EXIST: ' + name);
      if (e.type === 'dir') {
        const newName = prompt('Rename folder "' + name + '" to:', name);
        if (newName === null) return;
        const trimmed = newName.trim();
        if (!trimmed || trimmed === name) return;
        const newT = Utils.resolvePath(this.cwd, trimmed);
        if (newT === t) return;
        if (newT.startsWith(t + '/')) throw new Error('Cannot rename folder into itself');
        if (await Storage.get(newT, 'vfs')) throw new Error('THIS KEY IS ALREADY EXIST: ' + trimmed);
        const all = await Storage.keys('vfs');
        await Storage.set(newT, e, 'vfs');
        for (const k of all) {
          if (k.startsWith(t + '/')) {
            const v = await Storage.get(k, 'vfs');
            await Storage.set(newT + k.slice(t.length), v, 'vfs');
            await Storage.remove(k, 'vfs');
          }
        }
        await Storage.remove(t, 'vfs');
        this.printSuccess('Renamed: ' + name + ' -> ' + trimmed);
        return;
      }
      await new Promise(resolve => {
        const ov = document.getElementById('editor');
        const ta = document.getElementById('editor-text');
        const nameInput = document.getElementById('editor-name');
        nameInput.value = name;
        ov.classList.remove('hidden');
        ta.value = e.content || '';
        ta.focus();
        const cl = document.getElementById('editor-close');
        const sv = document.getElementById('editor-save');
        const cleanup = () => {
          ov.classList.add('hidden');
          cl.onclick = null; sv.onclick = null;
          document.getElementById('capture').focus();
          resolve();
        };
        cl.onclick = () => cleanup();
        sv.onclick = async () => {
          const newName = nameInput.value.trim() || name;
          const newT = Utils.resolvePath(this.cwd, newName);
          if (newT !== t) {
            if (await Storage.get(newT, 'vfs')) { this.printError('THIS KEY IS ALREADY EXIST: ' + newName); return; }
            await Storage.remove(t, 'vfs');
          }
          await Storage.set(newT, { type: 'file', content: ta.value }, 'vfs');
          this.printSuccess('Saved: ' + newName);
          cleanup();
        };
      });
    })();
  }
};

const UI = {
  miniWindows: {}, fallbackWindow: null, activeSession: null,
  sFont: null, sBg: null, sFontFamily: null,

  init() {
    document.getElementById('workspace').addEventListener('click', () => {
      const sel = window.getSelection();
      if (sel && sel.toString().length) return;
      if (state.session) state.session.cap.focus();
    });
    document.addEventListener('paste', (e) => {
      if (!document.getElementById('editor').classList.contains('hidden')) return;
      if (!document.getElementById('settings').classList.contains('hidden')) return;
      const s = UI.activeSession || state.session;
      if (!s) return;
      if (s.cap.disabled) return;
      s.cap.focus();
      const txt = (e.clipboardData || window.clipboardData).getData('text');
      if (txt) { s.cap.value += txt; s.updateLine(); e.preventDefault(); }
    });
    window.addEventListener('keydown', e => {
      if (e.ctrlKey && e.key.toLowerCase() === 'l') {
        const s = UI.activeSession || state.session;
        if (!s) return;
        if (!document.getElementById('editor').classList.contains('hidden')) return;
        if (!document.getElementById('settings').classList.contains('hidden')) return;
        e.preventDefault(); s.clear(); return;
      }
      if (!e.ctrlKey || e.key.toLowerCase() !== 'c') return;
      const s = UI.activeSession || state.session;
      if (!s) return;
      if (!document.getElementById('editor').classList.contains('hidden')) return;
      if (!document.getElementById('settings').classList.contains('hidden')) return;
      if (window.getSelection && window.getSelection().toString()) return;
      if (s.mode !== 'shell') {
        const handler = Terminal.modeHandlers[s.mode];
        if (handler && handler.onAbort) { e.preventDefault(); handler.onAbort(s); s.cap.value = ''; }
        return;
      }
      if (s.executing) return;
      e.preventDefault();
      s.print(s.promptEl.innerHTML + ' ' + Utils.escapeHTML(s.cap.value) + '^C', true);
      s.cap.value = '';
      s.updateLine();
    });
    const closeSettings = () => {
      document.getElementById('settings').classList.add('hidden');
      if (UI.activeSession) UI.activeSession.cap.focus();
    };
    document.getElementById('settings-x').onclick = closeSettings;
    document.getElementById('settings-cancel').onclick = closeSettings;
    document.getElementById('settings-save').onclick = async () => {
      const u = document.getElementById('s-user').value.trim() || 'user';
      const api = document.getElementById('s-api').value.trim();
      const f = UI.sFont.getValue();
      const b = UI.sBg.getValue();
      const ff = UI.sFontFamily.getValue();
      const oldUser = state.settings.username;
      
      state.settings = { username: u, apiBase: api, fontColor: f, bgColor: b, fontFamily: ff };
      try { localStorage.setItem('webterm_settings', JSON.stringify(state.settings)); } catch (e) {}
      
      if (api) window.URLS.base = api;
      
      if (u !== oldUser && state.session) {
        const oldHome = '/home/' + oldUser, newHome = '/home/' + u;
        if (!(await Storage.get(newHome, 'vfs'))) await Storage.set(newHome, { type: 'dir' }, 'vfs');
        if (state.session.cwd === oldHome || state.session.cwd.startsWith(oldHome + '/')) state.session.cwd = newHome;
      }
      this.applySettings();
      closeSettings();
    };
  },

  attachInput(session) {
    const cap = session.cap;
    cap.addEventListener('input', () => session.updateLine());
    cap.addEventListener('focus', () => { UI.activeSession = session; });
    cap.addEventListener('keydown', async e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (session.executing && !session._inputResolver) return;
        const v = cap.value;
        cap.value = '';
        session.updateLine();
        if (session._inputResolver) { try { await session.processInput(v); } catch (err) {} return; }
        session.executing = true;
        try { await session.processInput(v); }
        catch (err) {}
        finally { session.executing = false; }
        return;
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (session.historyIndex > 0) { session.historyIndex--; cap.value = session.history[session.historyIndex]; session.updateLine(); }
        return;
      }
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (session.historyIndex < session.history.length - 1) {
          session.historyIndex++;
          cap.value = session.history[session.historyIndex];
        } else {
          session.historyIndex = session.history.length;
          cap.value = '';
        }
        session.updateLine();
        return;
      }
    });
  },

  focusWindow(session) { if (!session) return; session.cap.focus(); UI.activeSession = session; },

  applyMiniTheme(session) {
    if (!session || !session.wrapper) return;
    const theme = session.customTheme || state.settings;
    const dark = theme.bgColor === 'bg-black';
    const colorMap = { 'text-black': dark ? '#ffffff' : '#000000', 'text-white': '#ffffff', 'text-green-600': '#16a34a' };
    const fg = colorMap[theme.fontColor] || (dark ? '#ffffff' : '#000000');
    const bg = dark ? '#000000' : '#ffffff';
    const headerBg = dark ? '#1f2937' : '#f3f4f6';
    const headerFg = dark ? '#e5e7eb' : '#374151';
    const borderColor = dark ? '#4b5563' : '#d1d5db';
    const fam = FONT_FAMILIES[theme.fontFamily] || FONT_FAMILIES.mono;
    session.container.style.color = fg;
    session.container.style.background = bg;
    session.container.style.fontFamily = fam;
    session.wrapper.style.background = bg;
    session.wrapper.style.borderColor = borderColor;
    session.wrapper.classList.toggle('dark', dark);
    const header = session.wrapper.querySelector('.mini-header');
    if (header) { header.style.background = headerBg; header.style.color = headerFg; header.style.borderBottomColor = borderColor; }
  },

  openSettings() {
    document.getElementById('s-user').value = state.settings.username;
    document.getElementById('s-api').value = state.settings.apiBase || '';
    const fontColorOptions = [
      { value: 'text-black', label: 'Black' },
      { value: 'text-white', label: 'White' },
      { value: 'text-green-600', label: 'Green' }
    ];
    const bgColorOptions = [
      { value: 'bg-white', label: 'White' },
      { value: 'bg-black', label: 'Black' }
    ];
    const fontFamilyOptions = Object.keys(FONT_FAMILIES).map(k => ({ value: k, label: FONT_LABELS[k] || k, fontFamily: FONT_FAMILIES[k] }));
    const fontWrap = document.getElementById('s-font-wrap'); fontWrap.innerHTML = '';
    UI.sFont = createCustomSelect(fontColorOptions, state.settings.fontColor, () => {});
    fontWrap.appendChild(UI.sFont.wrap);
    const bgWrap = document.getElementById('s-bg-wrap'); bgWrap.innerHTML = '';
    UI.sBg = createCustomSelect(bgColorOptions, state.settings.bgColor, () => {});
    bgWrap.appendChild(UI.sBg.wrap);
    const ffWrap = document.getElementById('s-fontfamily-wrap'); ffWrap.innerHTML = '';
    UI.sFontFamily = createCustomSelect(fontFamilyOptions, state.settings.fontFamily, (val) => {});
    ffWrap.appendChild(UI.sFontFamily.wrap);
    document.getElementById('settings').classList.remove('hidden');
  },

  openMiniSettings(session) {
    const theme = session.customTheme || state.settings;
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:absolute;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:200;animation:fadeIn 0.2s ease-out;';
    
    const card = document.createElement('div');
    card.style.cssText = 'background:#031a0e;color:#00d8ff;padding:12px;border-radius:6px;width:85%;max-height:80%;box-shadow:0 0 20px rgba(37,99,235,0.4);border:1px solid #2563eb;font-family:\'Share Tech Mono\',monospace;display:flex;flex-direction:column;box-sizing:border-box;animation:slideUp 0.2s ease-out;';
    
    const header = document.createElement('div');
    header.style.cssText = 'font-size:12px;font-weight:bold;color:#00d8ff;margin-bottom:10px;border-bottom:1px solid #1e3a8a;padding-bottom:6px;text-align:center;letter-spacing:1px;';
    header.textContent = 'MINI SETTINGS';
    card.appendChild(header);

    const content = document.createElement('div');
    content.style.cssText = 'flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;';
    
    const makeRow = (labelText) => {
      const row = document.createElement('div');
      const lbl = document.createElement('label');
      lbl.textContent = labelText;
      lbl.style.cssText = 'font-size:10px;display:block;color:#60a5fa;margin-bottom:4px;text-transform:uppercase;letter-spacing:1px;';
      const wrap = document.createElement('div');
      row.appendChild(lbl); row.appendChild(wrap);
      return { row, wrap };
    };

    const r1 = makeRow('Font Color');
    const r2 = makeRow('Background');
    const r3 = makeRow('Font Family');
    
    content.appendChild(r1.row); content.appendChild(r2.row); content.appendChild(r3.row);
    
    const btnRow = document.createElement('div');
    btnRow.style.cssText = 'display:flex;justify-content:flex-end;gap:8px;margin-top:12px;';
    const btnCancel = document.createElement('button');
    btnCancel.textContent = 'CANCEL';
    btnCancel.style.cssText = 'padding:4px 10px;font-size:11px;border:1px solid #1e3a8a;background:transparent;color:#60a5fa;border-radius:3px;cursor:pointer;font-family:inherit;transition:all 0.2s;';
    const btnSave = document.createElement('button');
    btnSave.textContent = 'SAVE';
    btnSave.style.cssText = 'padding:4px 10px;font-size:11px;border:1px solid #00d8ff;background:#1e3a8a;color:#00d8ff;border-radius:3px;cursor:pointer;font-family:inherit;transition:all 0.2s;';
    
    btnCancel.onmouseenter = () => { btnCancel.style.background = '#1e3a8a'; btnCancel.style.color = '#fff'; };
    btnCancel.onmouseleave = () => { btnCancel.style.background = 'transparent'; btnCancel.style.color = '#60a5fa'; };
    btnSave.onmouseenter = () => { btnSave.style.background = '#2563eb'; btnSave.style.color = '#fff'; btnSave.style.boxShadow = '0 0 8px #2563eb'; };
    btnSave.onmouseleave = () => { btnSave.style.background = '#1e3a8a'; btnSave.style.color = '#00d8ff'; btnSave.style.boxShadow = 'none'; };

    btnRow.appendChild(btnCancel); btnRow.appendChild(btnSave);
    card.appendChild(content);
    card.appendChild(btnRow);
    overlay.appendChild(card);
    session.wrapper.appendChild(overlay);

    const fontColorOptions = [
      { value: 'text-black', label: 'Black' },
      { value: 'text-white', label: 'White' },
      { value: 'text-green-600', label: 'Green' }
    ];
    const bgColorOptions = [
      { value: 'bg-white', label: 'White' },
      { value: 'bg-black', label: 'Black' }
    ];
    const fontFamilyOptions = Object.keys(FONT_FAMILIES).map(k => ({ value: k, label: FONT_LABELS[k] || k, fontFamily: FONT_FAMILIES[k] }));
    
    const msFont = createCustomSelect(fontColorOptions, theme.fontColor, () => {});
    const msBg = createCustomSelect(bgColorOptions, theme.bgColor, () => {});
    const msFf = createCustomSelect(fontFamilyOptions, theme.fontFamily, () => {});
    
    r1.wrap.appendChild(msFont.wrap);
    r2.wrap.appendChild(msBg.wrap);
    r3.wrap.appendChild(msFf.wrap);

    btnCancel.onclick = (e) => { e.stopPropagation(); overlay.remove(); };
    btnSave.onclick = (e) => {
      e.stopPropagation();
      session.customTheme = { fontColor: msFont.getValue(), bgColor: msBg.getValue(), fontFamily: msFf.getValue() };
      UI.applyMiniTheme(session);
      overlay.remove();
    };
  },

  applySettings() {
    const fam = FONT_FAMILIES[state.settings.fontFamily] || FONT_FAMILIES.mono;
    document.documentElement.style.setProperty('--term-font', fam);
    document.getElementById('workspace').style.background = state.settings.bgColor === 'bg-black' ? '#000' : '#fff';
    if (state.session) {
      state.session.container.className = 'term absolute inset-0 overflow-y-auto p-4 flex flex-col ' + state.settings.fontColor;
      state.session.updatePrompt();
    }
    for (const s of Object.values(UI.miniWindows)) this.applyMiniTheme(s);
    if (UI.fallbackWindow) this.applyMiniTheme(UI.fallbackWindow);
  },

  createSession() {
    state.session = new TerminalSession();
    Terminal.session = state.session;
    UI.activeSession = state.session;
    this.applySettings();
    UI.attachInput(state.session);
    state.session.cap.focus();
  }
};

async function boot() {
  try {
    if (!window.URLS) throw new Error('backend.js config not loaded');
    await Storage.init();
    if (!(await Storage.get('/', 'vfs'))) await Storage.set('/', { type: 'dir' }, 'vfs');
    if (!(await Storage.get('/home', 'vfs'))) await Storage.set('/home', { type: 'dir' }, 'vfs');
    const home = '/home/' + state.settings.username;
    if (!(await Storage.get(home, 'vfs'))) await Storage.set(home, { type: 'dir' }, 'vfs');
    await ExtensionManager.loadAll();
    UI.init();
    UI.createSession();
  } catch (e) {
    console.error(e);
    const el = document.getElementById('boot-error');
    if (el) el.classList.remove('hidden');
  }
}
window.addEventListener('DOMContentLoaded', boot);
